<script>
"use strict";
const WEATHER_API_URL="https://script.google.com/macros/s/AKfycbwoPLuj0rSsennsx01-B-6UxqBjqnPieocgVLQnJMKEgRw6fZziV5ZGVA3SusjVLF3o/exec";
const GIFT_BACKUP_ID_KEY="heartopiaGiftClaimBackupId.v1";
const ACCESS_SENT_DATE_KEY="heartopiaAccessSentDate.v1";
const ACCESS_EXCLUDED_KEY="heartopiaAccessExcluded.v1";
const GIFT_BACKUP_COOKIE="heartopiaGiftClaimBackupId";
const GIFT_BACKUP_COOKIE_MAX_AGE=315360000;
const E=Object.fromEntries(["giftCodeList","expiredGiftCodes","expiredGiftCodeList","giftBackupStatus","giftBackupCopyBtn","giftBackupCodeInput","giftBackupRestoreBtn","giftBackupRestoreStatus"].map(id=>[id,document.getElementById(id)]));
let giftCodes=[],giftClaimRevision=0,giftBackupSyncInFlight=false;
const pad=n=>String(n).padStart(2,"0");
function gameToday(){const d=new Date();d.setHours(d.getHours()-6);return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function isAdminRoute(){return false}
let toastTimeout;
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.remove("show"),1800)}
async function apiPost(payload){const response=await fetch(WEATHER_API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});if(!response.ok)throw Error("HTTP "+response.status);return response.json()}

function parseGiftDateText(text){
  const source = String(text || "")
    .normalize("NFKC")
    .replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
    .replace(/\r\n?/g, "\n")
    .replace(/\u00a0/g, " ")
    .replace(/　/g, " ")
    .replace(/[（(]\s*UTC\s*[+-]\s*\d+\s*[）)]/ig, " ")
    .replace(/UTC\s*[+-]\s*\d+/ig, " ")
    .replace(/まで/g, " ");
  const time = source.match(/(\d{1,2})[:：](\d{2})/);
  const hour = time ? Number(time[1]) : 23;
  const minute = time ? Number(time[2]) : 59;
  let m = source.match(/(20\d{2})\s*[年\/.-]\s*(\d{1,2})\s*[月\/.-]\s*(\d{1,2})\s*日?/);
  if(m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}T${pad(hour)}:${pad(minute)}`;
  m = source.match(/(\d{1,2})\s*[月\/.-]\s*(\d{1,2})\s*日?/);
  if(m){
    const now = gameToday();
    let year = now.getFullYear();
    const candidate = new Date(year, Number(m[1]) - 1, Number(m[2]), hour, minute);
    if(candidate.getTime() < now.getTime() - 30 * 86400000) year++;
    return `${year}-${pad(m[1])}-${pad(m[2])}T${pad(hour)}:${pad(minute)}`;
  }
  const parsed = new Date(source);
  if(!Number.isNaN(parsed.getTime())) return `${parsed.getFullYear()}-${pad(parsed.getMonth()+1)}-${pad(parsed.getDate())}T${pad(parsed.getHours())}:${pad(parsed.getMinutes())}`;
  return "";
}
function normalizeGiftCode(item, order=0){
  const rawStatus = String(item?.status || "active").trim().toLowerCase();
  const status = ["active","expired","hidden"].includes(rawStatus) ? rawStatus : "active";
  return {
    id:String(item?.id || ""),
    code:String(item?.code || "").trim(),
    reward:String(item?.reward || "").trim(),
    expiresAt:String(item?.expiresAt || "").trim(),
    sourceUrl:String(item?.sourceUrl || "").trim(),
    memo:String(item?.memo || "").trim(),
    status,
    createdAt:String(item?.createdAt || ""),
    updatedAt:String(item?.updatedAt || ""),
    order:Number(order) || 0
  };
}
function giftDate(value){
  const text = String(value || "").trim();
  if(!text) return null;
  const inputValue = parseGiftDateText(text);
  if(inputValue && inputValue !== text){
    const parsedInput = new Date(inputValue);
    if(!Number.isNaN(parsedInput.getTime())) return parsedInput;
  }
  const normalized = /^\d{4}-\d{2}-\d{2}$/.test(text) ? `${text}T23:59:59` : text;
  const d = new Date(normalized);
  return Number.isNaN(d.getTime()) ? null : d;
}
function giftExpired(item){
  if(item.status === "expired") return true;
  const d = giftDate(item.expiresAt);
  return Boolean(d && d.getTime() < Date.now());
}
function giftVisible(item){ return item.code && item.status !== "hidden"; }
function activeGiftCodes(){
  return giftCodes.filter(item => giftVisible(item) && !giftExpired(item)).sort(giftCodeSort);
}
function expiredGiftCodes(){
  return giftCodes.filter(item => giftVisible(item) && giftExpired(item)).sort(giftCodeSort);
}
function giftCodeSort(a, b){
  const at = giftSortTime(a);
  const bt = giftSortTime(b);
  if(at != null && bt != null && at !== bt) return bt - at;
  if(at != null && bt == null) return -1;
  if(at == null && bt != null) return 1;
  if(a.order !== b.order) return b.order - a.order;
  return String(a.code).localeCompare(String(b.code), "ja");
}
function giftSortTime(item){
  const updated = giftDate(item.updatedAt);
  if(updated) return updated.getTime();
  const created = giftDate(item.createdAt);
  return created ? created.getTime() : null;
}
function giftExpiryText(value){
  const d = giftDate(value);
  if(!String(value || "").trim()) return "期限なし";
  if(!d) return String(value);
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}まで`;
}
function giftSourceUrl(url){
  const text = String(url || "").trim();
  return /^https:\/\/(?:x\.com|twitter\.com)\/(?:myheartopia|Heartopia_JP)\/status\/\d{15,25}(?:\?[^\s]*)?$/i.test(text) ? text : "";
}
function giftClaimKey(code){ return `giftCodeClaimed:${code}`; }
function giftClaimed(code){ return localStorage.getItem(giftClaimKey(code)) === "1"; }
function normalizeGiftBackupId(value){
  const compact = String(value || "").trim().replace(/^HGD-/i,"").replace(/[\s-]/g,"").toLowerCase();
  return /^[a-f0-9]{32}$/.test(compact) ? compact : "";
}
function giftBackupCookieValue(){
  const prefix = GIFT_BACKUP_COOKIE + "=";
  return document.cookie.split(";").map(part => part.trim()).find(part => part.startsWith(prefix))?.slice(prefix.length) || "";
}
function storeGiftBackupId(value){
  const id = normalizeGiftBackupId(value);
  if(!id) return "";
  try{ localStorage.setItem(GIFT_BACKUP_ID_KEY, id); }catch(_){}
  document.cookie = `${GIFT_BACKUP_COOKIE}=${id}; Max-Age=${GIFT_BACKUP_COOKIE_MAX_AGE}; Path=/; SameSite=Lax; Secure`;
  return id;
}
function newGiftBackupId(){
  try{
    const bytes = new Uint8Array(16);
    crypto.getRandomValues(bytes);
    return [...bytes].map(value => value.toString(16).padStart(2,"0")).join("");
  }catch(_){
    return "";
  }
}
function giftBackupId(){
  let id = "";
  try{ id = normalizeGiftBackupId(localStorage.getItem(GIFT_BACKUP_ID_KEY)); }catch(_){}
  if(!id) id = normalizeGiftBackupId(giftBackupCookieValue());
  if(!id) id = newGiftBackupId();
  return storeGiftBackupId(id);
}
function giftBackupDisplayCode(value){
  const id = normalizeGiftBackupId(value);
  return id ? "HGD-" + id.match(/.{1,4}/g).join("-") : "";
}
function localGiftClaimCodes(){
  try{
    return Object.keys(localStorage)
      .filter(key => key.startsWith("giftCodeClaimed:") && localStorage.getItem(key) === "1")
      .map(key => key.slice("giftCodeClaimed:".length))
      .filter(Boolean);
  }catch(_){
    return [];
  }
}
function applyGiftClaimCodes(codes){
  (Array.isArray(codes) ? codes : []).forEach(code => {
    const text = String(code || "").trim();
    if(text) localStorage.setItem(giftClaimKey(text), "1");
  });
}
function setGiftBackupStatus(text, isError=false){
  if(E.giftBackupStatus){
    E.giftBackupStatus.textContent = text;
    E.giftBackupStatus.style.color = isError ? "#9a5b55" : "";
  }
}
async function syncGiftClaimBackup(options={}){
  if(isAdminRoute() || !WEATHER_API_URL) return null;
  if(giftBackupSyncInFlight && !options.force) return null;
  const id = normalizeGiftBackupId(options.backupId) || giftBackupId();
  if(!id){
    setGiftBackupStatus("受取済は端末内に保存中（バックアップ非対応）", true);
    return null;
  }
  storeGiftBackupId(id);
  const revision = giftClaimRevision;
  giftBackupSyncInFlight = true;
  setGiftBackupStatus("受取済をバックアップ中…");
  try{
    const result = await apiPost({
      action:"syncGiftClaims",
      backupId:id,
      claims:localGiftClaimCodes()
    });
    if(result.ok === false) throw new Error(result.error || "バックアップできませんでした");
    if(revision === giftClaimRevision){
      applyGiftClaimCodes(result.claims || []);
      renderGiftCodes();
    }
    setGiftBackupStatus(`受取済バックアップ済み（${(result.claims || []).length}件）`);
    return result;
  }catch(error){
    setGiftBackupStatus("端末内には保存済み。サーバーバックアップは再試行します", true);
    return null;
  }finally{
    giftBackupSyncInFlight = false;
    if(revision !== giftClaimRevision && !options.noRetry){
      setTimeout(() => syncGiftClaimBackup({force:true, noRetry:true}), 0);
    }
  }
}
async function pushGiftClaimState(code, claimed){
  if(isAdminRoute() || !WEATHER_API_URL) return;
  const id = giftBackupId();
  if(!id) return;
  try{
    const result = await apiPost({
      action:"setGiftClaimState",
      backupId:id,
      code:String(code || "").trim(),
      claimed:Boolean(claimed)
    });
    if(result.ok === false) throw new Error(result.error || "バックアップできませんでした");
    setGiftBackupStatus(`受取済バックアップ済み（${(result.claims || []).length}件）`);
  }catch(_){
    setGiftBackupStatus("端末内には保存済み。サーバーバックアップは再試行します", true);
  }
}
function setGiftClaimed(code, claimed, options={}){
  if(claimed) localStorage.setItem(giftClaimKey(code), "1");
  else localStorage.removeItem(giftClaimKey(code));
  giftClaimRevision++;
  if(options.sync !== false) pushGiftClaimState(code, claimed);
}
async function copyGiftBackupCode(){
  const id = giftBackupId();
  const display = giftBackupDisplayCode(id);
  if(!display){
    if(E.giftBackupRestoreStatus) E.giftBackupRestoreStatus.textContent = "復元コードを作成できませんでした。";
    return;
  }
  try{
    await navigator.clipboard.writeText(display);
    toast("復元コードをコピーしました");
    if(E.giftBackupRestoreStatus) E.giftBackupRestoreStatus.textContent = "復元コードをコピーしました。安全な場所に保存してください。";
  }catch(_){
    E.giftBackupCodeInput.value = display;
    E.giftBackupCodeInput.select();
    if(E.giftBackupRestoreStatus) E.giftBackupRestoreStatus.textContent = "復元コードを表示しました。手動でコピーしてください。";
  }
}
async function restoreGiftClaimsFromCode(){
  const id = normalizeGiftBackupId(E.giftBackupCodeInput.value);
  if(!id){
    E.giftBackupRestoreStatus.textContent = "復元コードの形式を確認してください。";
    return;
  }
  storeGiftBackupId(id);
  E.giftBackupRestoreBtn.disabled = true;
  E.giftBackupRestoreStatus.textContent = "受取済を復元中…";
  try{
    const result = await syncGiftClaimBackup({backupId:id, force:true});
    if(!result) throw new Error("復元できませんでした");
    E.giftBackupRestoreStatus.textContent = `受取済を復元しました（${(result.claims || []).length}件）。`;
    E.giftBackupCodeInput.value = "";
  }catch(error){
    E.giftBackupRestoreStatus.textContent = `復元できませんでした：${error.message}`;
  }finally{
    E.giftBackupRestoreBtn.disabled = false;
  }
}
function giftPublicMemo(value){
  const text = String(value || "").trim();
  if(!text) return "";
  if(/^(?:投稿文から下書き|スクショ確認あり|公式Discord自動取得|公式X自動取得)(?:\s*\/\s*日本語名未確認:.*)?$/i.test(text)) return "";
  return text;
}
function giftCardHtml(item, expired=false){
  const claimed = giftClaimed(item.code);
  return `
    <div class="giftCard${claimed ? " claimed" : ""}${expired ? " expired" : ""}">
      <div class="giftHead">
        <code class="giftCodeText" data-gift-code-text="${esc(item.code)}">${esc(item.code)}</code>
        <button type="button" class="giftCopy" data-gift-copy="${esc(item.code)}">コピー</button>
        <button type="button" class="giftClaim${claimed ? " claimed" : ""}" data-gift-toggle="${esc(item.code)}">${claimed ? "受取済" : "未受取"}</button>
      </div>
      ${item.reward ? `<div class="giftReward">報酬：${esc(item.reward)}</div>` : ""}
      <div class="giftMeta">
        <div>期限：${esc(giftExpiryText(item.expiresAt))}</div>
        ${giftPublicMemo(item.memo) ? `<div>メモ：${esc(giftPublicMemo(item.memo))}</div>` : ""}
        ${giftSourceUrl(item.sourceUrl) ? `<div><a class="giftSource" href="${esc(giftSourceUrl(item.sourceUrl))}" target="_blank" rel="noopener noreferrer">情報源を見る</a></div>` : ""}
      </div>
    </div>
  `;
}
function renderGiftCodes(){
  if(!E.giftCodeList) return;
  const active = activeGiftCodes();
  const expired = expiredGiftCodes();
  E.giftCodeList.innerHTML = active.length ? active.map(item => giftCardHtml(item)).join("") : `<p class="small">有効なギフトコードはありません。</p>`;
  E.expiredGiftCodeList.innerHTML = expired.length ? expired.map(item => giftCardHtml(item, true)).join("") : `<p class="small">期限切れコードはありません。</p>`;
  E.expiredGiftCodes.hidden = expired.length === 0;
}

function findGiftCodeInput(code){
  return [...document.querySelectorAll(".giftCodeText")].find(node => node.dataset.giftCodeText === code);
}

async function copyGiftCode(code){
  try{
    await navigator.clipboard.writeText(code);
    setGiftClaimed(code, true);
    renderGiftCodes();
    toast("ギフトコードをコピーしました");
  }catch(error){
    const input = findGiftCodeInput(code);
    if(input){
      const range = document.createRange();
      range.selectNodeContents(input);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
    }
    toast("手動でコピーしてください");
  }
}


function jstDateValue(date=new Date()){
 const parts=new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(date);
 const values=Object.fromEntries(parts.map(part=>[part.type,part.value]));
 return values.year+"-"+values.month+"-"+values.day;
}
function accessExcluded(){
 try{return localStorage.getItem(ACCESS_EXCLUDED_KEY)==="1"}catch(error){return true}
}
function accessSentDate(){
 try{return localStorage.getItem(ACCESS_SENT_DATE_KEY)||""}catch(error){return ""}
}
function setAccessSentDate(value){localStorage.setItem(ACCESS_SENT_DATE_KEY,value)}
async function recordAccessIfNeeded(){
 if(!WEATHER_API_URL||!navigator.locks?.request||window.heartopiaAnalytics?.isExcluded()!==false)return;
 try{
  await navigator.locks.request("heartopiaAccessRecord.v1",async()=>{
   if(accessExcluded()||window.heartopiaAnalytics?.isExcluded()!==false)return;
   const today=jstDateValue(),sentDate=accessSentDate();
   if(sentDate>=today)return;
   setAccessSentDate(sentDate);
   const result=await apiPost({action:"recordAccess"});
   if(result.ok!==true||!/^\d{4}-\d{2}-\d{2}$/.test(result.date||""))return;
   setAccessSentDate(result.date);
  });
 }catch(error){}
}
function normalizeSiteNotice(item){
 return {noticeDate:String(item?.noticeDate||""),noticeText:String(item?.noticeText||"").trim(),updatedAt:String(item?.updatedAt||"")};
}
function noticeDateText(value){
 const v=String(value||"").trim();
 if(!v)return "";
 const d=new Date(v+"T00:00:00");
 if(Number.isNaN(d.getTime()))return v;
 return d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate();
}
async function fetchSiteNotice(){
 const el=document.getElementById("siteNotice");
 try{
  const u=new URL(WEATHER_API_URL);u.searchParams.set("action","getSiteNotice");
  const resp=await fetch(u);if(!resp.ok)throw Error("HTTP "+resp.status);
  const data=await resp.json();if(data.ok===false)throw Error(data.error||"取得失敗");
  const item=normalizeSiteNotice(data.notice);
  if(!item.noticeText){el.hidden=true;return}
  const day=noticeDateText(item.noticeDate);
  el.innerHTML=(day?'<span class="siteNoticeDate">'+esc(day)+'</span>':"")+'<span>'+esc(item.noticeText)+'</span>';
  el.hidden=false;
 }catch(error){el.hidden=true}
}
async function fetchGiftCodes(){
 const status=document.getElementById("giftCodeLoadStatus");
 try{
  const url=new URL(WEATHER_API_URL);url.searchParams.set("action","getGiftCodes");
  const response=await fetch(url);if(!response.ok)throw Error("HTTP "+response.status);
  const result=await response.json();if(result.ok===false)throw Error(result.error||"APIエラー");
  giftCodes=(result.codes||[]).map((item,index)=>normalizeGiftCode(item,index)).filter(item=>item.code);
  renderGiftCodes();status.hidden=true;await syncGiftClaimBackup();
 }catch(error){status.textContent="ギフトコードを読み込めませんでした："+error.message}
}
[E.giftCodeList,E.expiredGiftCodeList].forEach(list=>list.addEventListener("click",event=>{
 const copy=event.target.closest("[data-gift-copy]"),toggle=event.target.closest("[data-gift-toggle]");
 if(copy)copyGiftCode(copy.dataset.giftCopy);
 if(toggle){const code=toggle.dataset.giftToggle;setGiftClaimed(code,!giftClaimed(code));renderGiftCodes();}
}));
E.giftBackupCopyBtn.addEventListener("click",copyGiftBackupCode);
E.giftBackupRestoreBtn.addEventListener("click",restoreGiftClaimsFromCode);
E.giftBackupCodeInput.addEventListener("keydown",event=>{if(event.key==="Enter")restoreGiftClaimsFromCode()});
fetchGiftCodes();
recordAccessIfNeeded();
fetchSiteNotice();

</script><section class="privacyTools" data-analytics-settings aria-label="利用状況の計測設定">
<p><a href="privacy.html">プライバシー・計測について</a></p>
<p data-analytics-status role="status">利用状況の計測は、許可するまで開始しません。</p>
<div data-analytics-choices><button type="button" data-analytics-allow>許可する</button><button type="button" data-analytics-deny>許可しない</button></div>
<button type="button" data-analytics-change hidden>計測設定を変更</button>
</section>
</body></html>
