name: Temporary admin fold style refinement

on:
  push:
    paths:
      - '.github/workflows/tmp-admin-fold-style.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-cards-collapse
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refine admin folding UI
        run: node tools/tmp-admin-fold-style-patch.mjs
      - name: Validate admin trigger tests
        run: node --test tools/test-weather-admin-trigger.mjs
      - name: Commit refined UI
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-admin-fold-style.yml tools/tmp-admin-fold-style-patch.mjs
          git add index.html tools/test-weather-admin-trigger.mjs
          git commit -m 'Refine admin card folding UI'
          git push origin HEAD:fix/admin-cards-collapse
