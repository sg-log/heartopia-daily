name: Weather Issue automation

on:
  issues:
    types: [opened, reopened]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  validate_capture:
    if: ${{ github.event.issue.title == '[weather-capture-request]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      adapter: ${{ steps.validate.outputs.adapter }}
      source_url: ${{ steps.validate.outputs.source_url }}
      issue_number: ${{ steps.validate.outputs.issue_number }}
    steps:
      - name: Check out trusted repository code
        uses: actions/checkout@v4

      - name: Validate capture Issue author, format, and JSON
        id: validate
        shell: pwsh
        run: >-
          ./tools/weather-issue-request.ps1
          -Mode Capture
          -EventPath "$env:GITHUB_EVENT_PATH"
          -NormalizedPath "$env:RUNNER_TEMP/weather-capture-request.json"

      - name: Test strict Issue validation
        shell: pwsh
        run: ./tools/test-weather-issue-request.ps1

  capture_x:
    needs: validate_capture
    if: ${{ needs.validate_capture.outputs.adapter == 'x-official-embed' }}
    uses: ./.github/workflows/weather-cloud-x-embed-evidence.yml
    with:
      source_url: ${{ needs.validate_capture.outputs.source_url }}

  capture_url:
    needs: validate_capture
    if: ${{ needs.validate_capture.outputs.adapter == 'direct-url' }}
    uses: ./.github/workflows/weather-cloud-url-evidence.yml
    with:
      source_url: ${{ needs.validate_capture.outputs.source_url }}

  publish_x_review_images:
    needs: [validate_capture, capture_x]
    if: ${{ needs.validate_capture.outputs.adapter == 'x-official-embed' && needs.capture_x.result == 'success' && needs.capture_x.outputs.raw_media_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      review_images_base64: ${{ steps.publish.outputs.review_images_base64 }}
    steps:
      - name: Check out trusted repository code
        uses: actions/checkout@v4

      - name: Download captured raw media artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.capture_x.outputs.artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.capture_x.outputs.artifact_run_id }}
          path: ${{ runner.temp }}/weather-review-source

      - name: Test private review image handoff
        shell: pwsh
        run: |
          node tools/test-weather-review-image.mjs
          ./tools/test-weather-review-image-publish.ps1

      - name: Save private expiring review images
        id: publish
        shell: pwsh
        env:
          WEATHER_POST_KEY: ${{ secrets.WEATHER_POST_KEY }}
        run: >-
          ./tools/weather-review-image-publish.ps1
          -ArtifactDirectory "$env:RUNNER_TEMP/weather-review-source"
          -ExpectedArtifactId "${{ needs.capture_x.outputs.artifact_id }}"
          -ExpectedArtifactName "${{ needs.capture_x.outputs.artifact_name }}"
          -ExpectedArtifactRunId "${{ needs.capture_x.outputs.artifact_run_id }}"
          -ResultPath "$env:RUNNER_TEMP/weather-review-publish-result.json"

  return_x_artifact:
    needs: [validate_capture, capture_x, publish_x_review_images]
    if: ${{ needs.publish_x_review_images.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Store artifact binding in Issue body and close successful request
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.validate_capture.outputs.issue_number }}
          ARTIFACT_RUN_ID: ${{ needs.capture_x.outputs.artifact_run_id }}
          ARTIFACT_ID: ${{ needs.capture_x.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.capture_x.outputs.artifact_name }}
          EVIDENCE_SHA256: ${{ needs.capture_x.outputs.evidence_sha256 }}
          REVIEW_IMAGES_BASE64: ${{ needs.publish_x_review_images.outputs.review_images_base64 }}
        with:
          script: |
            const reviewImages = JSON.parse(Buffer.from(process.env.REVIEW_IMAGES_BASE64, 'base64').toString('utf8'))
            const validImages = Array.isArray(reviewImages) && reviewImages.length >= 1 && reviewImages.length <= 4 && reviewImages.every((item, index) =>
              item && item.file === `raw-media-${index}.${item.mimeType === 'image/png' ? 'png' : 'jpg'}` &&
              (item.mimeType === 'image/jpeg' || item.mimeType === 'image/png') &&
              Number.isSafeInteger(item.byteSize) && item.byteSize > 0 && item.byteSize <= 524288 &&
              /^[a-f0-9]{64}$/.test(item.captureSha256) && item.reviewStoredSha256 === item.captureSha256 &&
              /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/(?:exec|dev)\?reviewToken=[A-Za-z0-9_-]{43}$/.test(item.reviewUrl) &&
              /^20[0-9]{2}-[0-9]{2}-[0-9]{2}T/.test(item.expiresAt)
            )
            if (!validImages) {
              core.setFailed('Private review image bindings are missing or invalid.')
              return
            }
            const record = {
              schemaVersion: 3,
              responseType: 'weather-evidence-artifact',
              requestIssue: Number(process.env.ISSUE_NUMBER),
              artifact: {
                runId: process.env.ARTIFACT_RUN_ID,
                id: process.env.ARTIFACT_ID,
                name: process.env.ARTIFACT_NAME
              },
              legacyEvidenceSha256: process.env.EVIDENCE_SHA256,
              reviewImages
            }
            await github.rest.issues.update({
              ...context.repo,
              issue_number: record.requestIssue,
              body: `<!-- heartopia-weather-artifact-v3 -->\n\`\`\`json\n${JSON.stringify(record)}\n\`\`\``,
              state: 'closed',
              state_reason: 'completed'
            })

  return_x_artifact_fallback:
    needs: [validate_capture, capture_x]
    if: ${{ needs.validate_capture.outputs.adapter == 'x-official-embed' && needs.capture_x.result == 'success' && needs.capture_x.outputs.raw_media_count == '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Store rendered evidence binding in Issue body and close successful request
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.validate_capture.outputs.issue_number }}
          ARTIFACT_RUN_ID: ${{ needs.capture_x.outputs.artifact_run_id }}
          ARTIFACT_ID: ${{ needs.capture_x.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.capture_x.outputs.artifact_name }}
          EVIDENCE_SHA256: ${{ needs.capture_x.outputs.evidence_sha256 }}
        with:
          script: |
            const record = {
              schemaVersion: 4,
              responseType: 'weather-evidence-artifact',
              requestIssue: Number(process.env.ISSUE_NUMBER),
              artifact: {
                runId: process.env.ARTIFACT_RUN_ID,
                id: process.env.ARTIFACT_ID,
                name: process.env.ARTIFACT_NAME
              },
              reviewImages: [{
                file: 'evidence.jpg',
                mimeType: 'image/jpeg',
                captureSha256: process.env.EVIDENCE_SHA256,
                kind: 'screenshot'
              }]
            }
            await github.rest.issues.update({
              ...context.repo,
              issue_number: record.requestIssue,
              body: `<!-- heartopia-weather-artifact-v4 -->\n\`\`\`json\n${JSON.stringify(record)}\n\`\`\``,
              state: 'closed',
              state_reason: 'completed'
            })

  return_url_artifact:
    needs: [validate_capture, capture_url]
    if: ${{ needs.capture_url.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Store artifact binding in Issue body and close successful request
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.validate_capture.outputs.issue_number }}
          ARTIFACT_RUN_ID: ${{ needs.capture_url.outputs.artifact_run_id }}
          ARTIFACT_ID: ${{ needs.capture_url.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.capture_url.outputs.artifact_name }}
          EVIDENCE_SHA256: ${{ needs.capture_url.outputs.evidence_sha256 }}
        with:
          script: |
            const record = {
              schemaVersion: 1,
              responseType: 'weather-evidence-artifact',
              requestIssue: Number(process.env.ISSUE_NUMBER),
              artifact: {
                runId: process.env.ARTIFACT_RUN_ID,
                id: process.env.ARTIFACT_ID,
                name: process.env.ARTIFACT_NAME
              },
              evidenceSha256: process.env.EVIDENCE_SHA256
            }
            await github.rest.issues.update({
              ...context.repo,
              issue_number: record.requestIssue,
              body: `<!-- heartopia-weather-artifact-v1 -->\n\`\`\`json\n${JSON.stringify(record)}\n\`\`\``,
              state: 'closed',
              state_reason: 'completed'
            })

  validate_review:
    if: ${{ github.event.issue.title == '[weather-review-result]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      issue_number: ${{ steps.validate.outputs.issue_number }}
      review_payload_base64: ${{ steps.validate.outputs.review_payload_base64 }}
      artifact_run_id: ${{ steps.validate.outputs.artifact_run_id }}
      artifact_id: ${{ steps.validate.outputs.artifact_id }}
      artifact_name: ${{ steps.validate.outputs.artifact_name }}
      evidence_sha256: ${{ steps.validate.outputs.evidence_sha256 }}
      review_mode: ${{ steps.validate.outputs.review_mode }}
    steps:
      - name: Check out trusted repository code
        uses: actions/checkout@v4

      - name: Validate review Issue author, format, and JSON
        id: validate
        shell: pwsh
        run: >-
          ./tools/weather-issue-request.ps1
          -Mode Review
          -EventPath "$env:GITHUB_EVENT_PATH"
          -NormalizedPath "$env:RUNNER_TEMP/weather-review-request.json"

      - name: Test strict Issue validation
        shell: pwsh
        run: ./tools/test-weather-issue-request.ps1

  register_reviewed_pending:
    needs: validate_review
    uses: ./.github/workflows/weather-cloud-reviewed-evidence.yml
    with:
      review_payload_base64: ${{ needs.validate_review.outputs.review_payload_base64 }}
      submit_pending: true
    secrets:
      WEATHER_POST_KEY: ${{ secrets.WEATHER_POST_KEY }}
      WEATHER_ADMIN_KEY: ${{ secrets.WEATHER_ADMIN_KEY }}

  return_pending_result:
    needs: [validate_review, register_reviewed_pending]
    if: ${{ needs.register_reviewed_pending.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Store pending result in Issue body and close successful request
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.validate_review.outputs.issue_number }}
          ARTIFACT_RUN_ID: ${{ needs.validate_review.outputs.artifact_run_id }}
          ARTIFACT_ID: ${{ needs.validate_review.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.validate_review.outputs.artifact_name }}
          EVIDENCE_SHA256: ${{ needs.validate_review.outputs.evidence_sha256 }}
          REPORT_ID: ${{ needs.register_reviewed_pending.outputs.report_id }}
          DUPLICATE: ${{ needs.register_reviewed_pending.outputs.duplicate }}
          CAPTURE_SHA256: ${{ needs.register_reviewed_pending.outputs.capture_sha256 }}
          STAGE2_REFETCH_SHA256: ${{ needs.register_reviewed_pending.outputs.stage2_refetch_sha256 }}
          REVIEW_STORAGE_SHA256: ${{ needs.register_reviewed_pending.outputs.review_storage_sha256 }}
          PENDING_EVIDENCE_SOURCE: ${{ needs.register_reviewed_pending.outputs.pending_evidence_source }}
          REVIEW_SCOPE: ${{ needs.register_reviewed_pending.outputs.review_scope }}
          SHA256_MATCH: ${{ needs.register_reviewed_pending.outputs.sha256_match }}
        with:
          script: |
            const record = {
              schemaVersion: 1,
              responseType: 'weather-pending-result',
              requestIssue: Number(process.env.ISSUE_NUMBER),
              status: 'pending',
              reportId: process.env.REPORT_ID,
              duplicate: process.env.DUPLICATE === 'true',
              artifact: {
                runId: process.env.ARTIFACT_RUN_ID,
                id: process.env.ARTIFACT_ID,
                name: process.env.ARTIFACT_NAME
              },
              evidenceSha256: process.env.EVIDENCE_SHA256,
              verification: {
                captureArtifactSha256: process.env.CAPTURE_SHA256,
                stage2RefetchSha256: process.env.STAGE2_REFETCH_SHA256,
                reviewStorageSha256: process.env.REVIEW_STORAGE_SHA256,
                sha256Match: process.env.SHA256_MATCH === 'true',
                pendingEvidenceSource: process.env.PENDING_EVIDENCE_SOURCE,
                workVisualReviewScope: process.env.REVIEW_SCOPE,
                workDisplayBytesCryptographicallyVerified: false
              }
            }
            await github.rest.issues.update({
              ...context.repo,
              issue_number: record.requestIssue,
              body: `<!-- heartopia-weather-pending-v1 -->\n\`\`\`json\n${JSON.stringify(record)}\n\`\`\``,
              state: 'closed',
              state_reason: 'completed'
            })
