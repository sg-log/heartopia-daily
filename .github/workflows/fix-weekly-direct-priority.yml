name: Fix weekly display priority

on:
  push:
    branches: [fix/weekly-direct-priority]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/weekly-direct-priority
      - name: Prefer the selected day's weekly forecast
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = "\n".join([
            "  const weeks = Object.fromEntries(WEATHER_WEEK_KEYS.map((key, index) => [",
            "    key,",
            "    weekIndexMap.get(weekDate(date, index)) || []",
            "  ]));",
            "  const raw = rawWeatherData(date);"
          ])
          new = "\n".join([
            "  const raw = rawWeatherData(date);",
            "  const weeks = Object.fromEntries(WEATHER_WEEK_KEYS.map((key, index) => {",
            "    const direct = weatherValues(raw?.weeks?.[key]);",
            "    return [",
            "      key,",
            "      direct.length ? direct : (weekIndexMap.get(weekDate(date, index)) || [])",
            "    ];",
            "  }));"
          ])
          if text.count(old) != 1:
              raise SystemExit(f'expected weekly display block once, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Verify weekly display precedence
        shell: python
        run: |
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
            'const direct = weatherValues(raw?.weeks?.[key]);',
            'direct.length ? direct : (weekIndexMap.get(weekDate(date, index)) || [])'
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit('missing expected weekly precedence logic: ' + needle)
          print('weekly direct-priority check passed')
      - name: Run existing admin trigger test
        run: node tools/test-weather-admin-trigger.mjs
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-weekly-direct-priority.yml
          git add index.html
          git commit -m "Prefer selected-day weekly forecast"
          git push origin HEAD:fix/weekly-direct-priority
