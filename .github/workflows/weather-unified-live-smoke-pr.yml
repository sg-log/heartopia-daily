name: Weather unified live smoke PR

on:
  pull_request:

permissions:
  contents: read

jobs:
  unified-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Capture known live game weather post
        env:
          CAPTURE_DIR: ${{ runner.temp }}/weather-unified-live
        run: node tools/weather-x-embed-evidence.mjs --url https://x.com/i/status/2099971105733927184 --output-dir "$CAPTURE_DIR"

      - name: Add discovery provenance used by production bridge
        shell: pwsh
        env:
          CAPTURE_DIR: ${{ runner.temp }}/weather-unified-live
        run: |
          ./tools/weather-cloud-discovery.ps1 `
            -CapturePath (Join-Path $env:CAPTURE_DIR 'capture.json') `
            -OutputPath (Join-Path $env:CAPTURE_DIR 'discovery-candidate.json') `
            -DiscoverySource 'live-smoke' `
            -SearchQuery 'ハートピア 天気 2026-09-16'

      - name: Inspect daily and weekly through production review entry point
        env:
          CAPTURE_DIR: ${{ runner.temp }}/weather-unified-live
          REVIEW_PATH: ${{ runner.temp }}/weather-unified-review.json
        run: node tools/weather-unified-review.mjs --mode inspect --capture-dir "$CAPTURE_DIR" --target-date 2026-09-16 --output "$REVIEW_PATH"

      - name: Upload exact live evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: weather-unified-live-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/weather-unified-live
          if-no-files-found: error
          retention-days: 2

      - name: Bind review to immutable artifact
        id: bind
        shell: pwsh
        env:
          REVIEW_PATH: ${{ runner.temp }}/weather-unified-review.json
          ENVELOPE_PATH: ${{ runner.temp }}/weather-unified-envelope.json
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_NAME: weather-unified-live-evidence-${{ github.run_id }}
        run: >-
          node tools/weather-unified-bind.mjs
          --draft "$env:REVIEW_PATH"
          --artifact-run-id "${{ github.run_id }}"
          --artifact-id "$env:ARTIFACT_ID"
          --artifact-name "$env:ARTIFACT_NAME"
          --output "$env:ENVELOPE_PATH"

      - name: Verify evidence hashes and prepare pending preview
        id: bridge
        shell: pwsh
        env:
          REVIEW_PAYLOAD_BASE64: ${{ steps.bind.outputs.review_payload_base64 }}
          REVIEW_PATH: ${{ runner.temp }}/weather-artifact-review.json
          CAPTURE_DIR: ${{ runner.temp }}/weather-unified-live
          RESULT_DIR: ${{ runner.temp }}/weather-unified-result
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_NAME: weather-unified-live-evidence-${{ github.run_id }}
        run: |
          ./tools/weather-artifact-review-request.ps1 -ReviewPayloadBase64 "$env:REVIEW_PAYLOAD_BASE64" -ReviewPath "$env:REVIEW_PATH"
          ./tools/weather-artifact-review-bridge.ps1 `
            -ReviewPath "$env:REVIEW_PATH" `
            -ArtifactDirectory "$env:CAPTURE_DIR" `
            -DownloadedArtifactId "$env:ARTIFACT_ID" `
            -DownloadedArtifactName "$env:ARTIFACT_NAME" `
            -DownloadedArtifactRunId "${{ github.run_id }}" `
            -CandidatePath "$env:RESULT_DIR/weather-candidate.json" `
            -DryRunPath "$env:RESULT_DIR/weather-dry-run.json" `
            -PendingPreviewPath "$env:RESULT_DIR/pending-preview.json"
          if ("${{ steps.bridge.outputs.pending_prepared }}" -eq 'false') { throw 'Pending preview was not prepared.' }

      - name: Validate expected live interpretation
        shell: pwsh
        env:
          REVIEW_PATH: ${{ runner.temp }}/weather-unified-review.json
        run: |
          $review = Get-Content -LiteralPath $env:REVIEW_PATH -Raw -Encoding UTF8 | ConvertFrom-Json
          $daily = (($review.interpretation.slots | ForEach-Object { $_.weather -join '+' }) -join ',')
          $weekly = (($review.interpretation.weeklyDays | ForEach-Object { $_.weather -join '+' }) -join ',')
          if ([string]$review.interpretation.startSlot -ne '06') { throw "Unexpected startSlot: $($review.interpretation.startSlot)" }
          if ($daily -ne '晴,晴,晴,雨,晴') { throw "Unexpected daily: $daily" }
          if ($weekly -ne '雨,晴,晴,虹,晴') { throw "Unexpected weekly: $weekly" }
          $dates = (($review.interpretation.weeklyDays | ForEach-Object { $_.date }) -join ',')
          if ($dates -ne '2026-09-17,2026-09-18,2026-09-19,2026-09-20,2026-09-21') { throw "Unexpected weekly dates: $dates" }
          Write-Host "Verified daily=$daily weekly=$weekly dates=$dates"

      - name: Upload smoke diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: weather-unified-live-smoke-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/weather-unified-review.json
            ${{ runner.temp }}/weather-unified-envelope.json
            ${{ runner.temp }}/weather-artifact-review.json
            ${{ runner.temp }}/weather-unified-result
          if-no-files-found: warn
          retention-days: 2
