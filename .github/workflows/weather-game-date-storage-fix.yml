name: Weather game date storage fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/weather-game-date-storage-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Preserve Heartopia game date as text
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps-script/weather-api.gs')
          s = p.read_text(encoding='utf-8-sig')

          old = '''      storageStage = "pendingSave";\n      sheet.appendRow(row.concat([sourceUrl, JSON.stringify(sourceImageUrls), sourceType, retrievedAt, file ? "saved" : "missing", JSON.stringify(references)]));'''
          new = '''      storageStage = "pendingSave";\n      const pendingRow = row.concat([sourceUrl, JSON.stringify(sourceImageUrls), sourceType, retrievedAt, file ? "saved" : "missing", JSON.stringify(references)]);\n      const pendingRowIndex = sheet.getLastRow() + 1;\n      if (pendingRowIndex > sheet.getMaxRows()) sheet.insertRowsAfter(sheet.getMaxRows(), pendingRowIndex - sheet.getMaxRows());\n      sheet.getRange(pendingRowIndex, HEADERS.indexOf("date") + 1).setNumberFormat("@");\n      sheet.getRange(pendingRowIndex, 1, 1, pendingRow.length).setValues([pendingRow]);'''
          if old not in s:
              raise SystemExit('submit pending append anchor not found')
          s = s.replace(old, new, 1)

          old = '''      sheet.getRange(i + 1, 1, 1, HEADERS.length).setValues([row]);\n      updated++;'''
          new = '''      sheet.getRange(i + 1, dateColumn + 1).setNumberFormat("@");\n      sheet.getRange(i + 1, 1, 1, HEADERS.length).setValues([row]);\n      updated++;'''
          if old not in s:
              raise SystemExit('saveApproved update anchor not found')
          s = s.replace(old, new, 1)

          old = '''    sheet.appendRow(row);\n    return json_({ ok: true, id: row[0], status: "approved", mode: "created" });'''
          new = '''    const approvedRowIndex = sheet.getLastRow() + 1;\n    if (approvedRowIndex > sheet.getMaxRows()) sheet.insertRowsAfter(sheet.getMaxRows(), approvedRowIndex - sheet.getMaxRows());\n    sheet.getRange(approvedRowIndex, dateColumn + 1).setNumberFormat("@");\n    sheet.getRange(approvedRowIndex, 1, 1, row.length).setValues([row]);\n    return json_({ ok: true, id: row[0], status: "approved", mode: "created" });'''
          if old not in s:
              raise SystemExit('saveApproved create anchor not found')
          s = s.replace(old, new, 1)

          old = '''  sheet.getRange(1, HEADERS.indexOf("startSlot") + 1, Math.max(sheet.getMaxRows(), 1), 1).setNumberFormat("@");\n  return sheet;'''
          new = '''  sheet.getRange(1, HEADERS.indexOf("date") + 1, Math.max(sheet.getMaxRows(), 1), 1).setNumberFormat("@");\n  sheet.getRange(1, HEADERS.indexOf("startSlot") + 1, Math.max(sheet.getMaxRows(), 1), 1).setNumberFormat("@");\n  return sheet;'''
          if old not in s:
              raise SystemExit('getSheet format anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Assert game date storage is text-safe
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('apps-script/weather-api.gs').read_text(encoding='utf-8')
          checks = [
              'sheet.getRange(pendingRowIndex, HEADERS.indexOf("date") + 1).setNumberFormat("@");',
              'sheet.getRange(i + 1, dateColumn + 1).setNumberFormat("@");',
              'sheet.getRange(approvedRowIndex, dateColumn + 1).setNumberFormat("@");',
              'sheet.getRange(1, HEADERS.indexOf("date") + 1, Math.max(sheet.getMaxRows(), 1), 1).setNumberFormat("@");'
          ]
          for item in checks:
              assert item in s, item
          assert 'sheet.appendRow(row.concat([sourceUrl' not in s
          print('GAME_DATE_TEXT_STORAGE_OK')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps-script/weather-api.gs
          git commit -m 'Preserve Heartopia game date as text'
          git push origin main
