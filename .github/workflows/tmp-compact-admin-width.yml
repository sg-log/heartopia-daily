name: Temporary compact admin width
on:
  push:
    branches: [fix/admin-compact-width]
    paths: [.github/workflows/tmp-compact-admin-width.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-compact-width
      - name: Compact admin cards
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.adminTabPanel>.s12,.adminTabPanel>.adminFoldToolbar,.adminTabPanel>.adminSettingsGrid{grid-column:1;width:100%}'
          new = '.adminTabPanel>.s12,.adminTabPanel>.adminFoldToolbar,.adminTabPanel>.adminSettingsGrid{grid-column:1;width:min(100%,700px);justify-self:center}'
          if old not in s:
              raise SystemExit('target css not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Validate admin trigger tests
        run: node tools/test-weather-admin-trigger.mjs
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Compact admin card width'
          git rm .github/workflows/tmp-compact-admin-width.yml
          git commit -m 'Remove temporary admin width workflow'
          git push origin HEAD:fix/admin-compact-width
