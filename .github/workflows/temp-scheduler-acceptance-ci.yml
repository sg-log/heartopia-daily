name: Temporary scheduler acceptance CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-scheduler-acceptance-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/test-weather-apps-script-scheduler.mjs
      - run: node tools/test-clasp-scheduler-include.mjs

# rerun after test fix
