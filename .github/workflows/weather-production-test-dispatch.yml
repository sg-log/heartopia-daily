name: Weather production test dispatcher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/weather-production-test-dispatch.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-production-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch real production weather workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run weather-scheduled-run.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f slot=evening \
            -f target_date=2026-09-17 \
            -f trigger_origin=manual \
            -f attempt_kind=manual
