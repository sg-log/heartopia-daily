name: Weather scheduled run

on:
  schedule:
    # GitHub cron is only a delayed backup clock now. Apps Script owns the 07:00/07:10 and 19:00/19:10 primary timing.
    - cron: '30 22 * * *'
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Update slot to retry manually'
        required: true
        type: choice
        options: [auto, morning, evening]
        default: auto
      target_date:
        description: 'Heartopia game date (YYYY-MM-DD); blank uses the current 06:00-based game date'
        required: false
        type: string
        default: ''
      trigger_origin:
        description: 'Internal trigger origin'
        required: true
        type: choice
        options: [manual, apps-script]
        default: manual
      attempt_kind:
        description: 'Internal attempt kind'
        required: true
        type: choice
        options: [manual, primary, retry]
        default: manual
      dry_run:
        description: 'Validate discovery/review without creating pending, issue, or Discord notification'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: read

env:
  WEATHER_DC_WEBHOOK_URL: ${{ secrets.WEATHER_DC_WEBHOOK_URL }}

concurrency:
  group: weather-scheduled-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve JST update slot
        id: slot
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_SLOT: ${{ inputs.slot }}
          MANUAL_TARGET_DATE: ${{ inputs.target_date }}
          MANUAL_ORIGIN: ${{ inputs.trigger_origin }}
          MANUAL_ATTEMPT_KIND: ${{ inputs.attempt_kind }}
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          $nowUtc = if ([string]::IsNullOrWhiteSpace([string]$env:WEATHER_RESOLVE_NOW_UTC)) {
            [DateTimeOffset]::UtcNow
          } else {
            try {
              [DateTimeOffset]::Parse(
                [string]$env:WEATHER_RESOLVE_NOW_UTC,
                [Globalization.CultureInfo]::InvariantCulture,
                [Globalization.DateTimeStyles]::AssumeUniversal -bor [Globalization.DateTimeStyles]::AdjustToUniversal
              )
            } catch { throw 'Invalid weather resolver UTC clock.' }
          }
          $nowUtc = $nowUtc.ToUniversalTime()
          $nowJst = $nowUtc.ToOffset([TimeSpan]::FromHours(9))
          $targetDate = $nowJst.AddHours(-6).ToString('yyyy-MM-dd')
          $slot = ''
          $isSnooze = 'false'
          $origin = ''
          $attemptKind = ''
          $dryRun = 'false'
          if ($env:EVENT_NAME -eq 'schedule') {
            $origin = 'github-backup'
            $attemptKind = 'backup'
            $isSnooze = 'true'
            switch ($env:EVENT_SCHEDULE) {
              '30 22 * * *' { $slot = 'morning' }
              '30 10 * * *' { $slot = 'evening' }
              # Gracefully absorb schedule events queued before the Apps Script handoff.
              '0 22 * * *'  { $slot = 'morning'; $origin = 'github-legacy' }
              '10 22 * * *' { $slot = 'morning'; $origin = 'github-legacy' }
              '0 10 * * *'  { $slot = 'evening'; $origin = 'github-legacy' }
              '10 10 * * *' { $slot = 'evening'; $origin = 'github-legacy' }
              default { throw "Unknown schedule: $env:EVENT_SCHEDULE" }
            }
            $cronParts = @(([string]$env:EVENT_SCHEDULE -split '\s+') | Where-Object { $_ })
            if ($cronParts.Count -ne 5) { throw "Invalid schedule: $env:EVENT_SCHEDULE" }
            $scheduledMinute = [int]$cronParts[0]
            $scheduledHour = [int]$cronParts[1]
            $scheduledUtc = [DateTimeOffset]::new(
              $nowUtc.Year,
              $nowUtc.Month,
              $nowUtc.Day,
              $scheduledHour,
              $scheduledMinute,
              0,
              [TimeSpan]::Zero
            )
            if ($scheduledUtc -gt $nowUtc) { $scheduledUtc = $scheduledUtc.AddDays(-1) }
            $targetDate = $scheduledUtc.ToOffset([TimeSpan]::FromHours(9)).AddHours(-6).ToString('yyyy-MM-dd')
          } else {
            $slot = [string]$env:MANUAL_SLOT
            if ([string]::IsNullOrWhiteSpace($slot) -or $slot -eq 'auto') {
              $slot = if ($nowJst.Hour -ge 6 -and $nowJst.Hour -lt 13) { 'morning' } else { 'evening' }
            }
            if ($slot -notin @('morning','evening')) { throw 'Invalid manual slot.' }
            if (-not [string]::IsNullOrWhiteSpace([string]$env:MANUAL_TARGET_DATE)) {
              try { [void][datetime]::ParseExact([string]$env:MANUAL_TARGET_DATE, 'yyyy-MM-dd', [Globalization.CultureInfo]::InvariantCulture) }
              catch { throw 'Invalid manual target date.' }
              $targetDate = [string]$env:MANUAL_TARGET_DATE
            }
            $origin = [string]$env:MANUAL_ORIGIN
            if ([string]::IsNullOrWhiteSpace($origin)) { $origin = 'manual' }
            $attemptKind = [string]$env:MANUAL_ATTEMPT_KIND
            if ([string]::IsNullOrWhiteSpace($attemptKind)) { $attemptKind = 'manual' }
            if ($origin -eq 'manual' -and $attemptKind -ne 'manual') { throw 'Manual dispatch must use attempt_kind=manual.' }
            if ($origin -eq 'apps-script' -and $attemptKind -notin @('primary','retry')) { throw 'Apps Script dispatch must use primary or retry.' }
            if ($origin -notin @('manual','apps-script')) { throw 'Invalid trigger origin.' }
            if ($origin -eq 'apps-script' -and $attemptKind -eq 'retry') { $isSnooze = 'true' }
            if ([string]$env:MANUAL_DRY_RUN -eq 'true') { $dryRun = 'true' }
          }
          "target_date=$targetDate" >> $env:GITHUB_OUTPUT
          "slot=$slot" >> $env:GITHUB_OUTPUT
          "is_snooze=$isSnooze" >> $env:GITHUB_OUTPUT
          "origin=$origin" >> $env:GITHUB_OUTPUT
          "attempt_kind=$attemptKind" >> $env:GITHUB_OUTPUT
          "dry_run=$dryRun" >> $env:GITHUB_OUTPUT
          "run_key=$targetDate-$slot" >> $env:GITHUB_OUTPUT

      - name: Check whether this update slot already succeeded
        id: guard
        uses: actions/github-script@v7
        env:
          RUN_KEY: ${{ steps.slot.outputs.run_key }}
          ORIGIN: ${{ steps.slot.outputs.origin }}
        with:
          script: |
            if (process.env.ORIGIN === 'manual') {
              core.setOutput('already_succeeded', 'false')
              core.notice(`Manual retry for ${process.env.RUN_KEY}; existing success markers do not block re-review.`)
              return
            }
            const marker = `<!-- heartopia-weather-scheduled-success:${process.env.RUN_KEY} -->`
            const { data } = await github.rest.issues.listForRepo({ ...context.repo, state:'all', per_page:100, sort:'created', direction:'desc' })
            const found = data.some(issue => !issue.pull_request && typeof issue.body === 'string' && issue.body.includes(marker))
            core.setOutput('already_succeeded', found ? 'true' : 'false')
            if (found) core.notice(`Update slot ${process.env.RUN_KEY} already succeeded; nothing to do.`)

      - name: Check out trusted repository code
        if: ${{ steps.guard.outputs.already_succeeded != 'true' }}
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: ${{ steps.guard.outputs.already_succeeded != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: ${{ steps.guard.outputs.already_succeeded != 'true' }}
        run: npm ci

      - name: Install Playwright Chromium
        if: ${{ steps.guard.outputs.already_succeeded != 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Load recent weather source history
        id: source_history
        if: ${{ steps.guard.outputs.already_succeeded != 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.issues.listForRepo({ ...context.repo, state:'all', per_page:100, sort:'created', direction:'desc' })
            const records = []
            for (const issue of data) {
              if (issue.pull_request || typeof issue.body !== 'string' || !issue.body.includes('heartopia-weather-scheduled-v4')) continue
              const match = issue.body.match(/```json\s*([\s\S]*?)\s*```/)
              if (!match) continue
              try {
                const record = JSON.parse(match[1])
                if (record && ['pending','content-duplicate'].includes(record.status) && record.sourceUrl) records.push(record)
              } catch {}
              if (records.length >= 8) break
            }
            const handles = [...new Set(records.map(r => String(r.sourceHandle || '').toLowerCase()).filter(Boolean))].slice(0,5)
            const urls = [...new Set(records.map(r => String(r.sourceUrl || '')).filter(Boolean))].slice(0,8)
            core.setOutput('handles', handles.join(','))
            core.setOutput('urls', urls.join('|'))

      - name: Discover public weather candidates
        if: ${{ steps.guard.outputs.already_succeeded != 'true' }}
        env:
          TARGET_DATE: ${{ steps.slot.outputs.target_date }}
          RESULT_PATH: ${{ runner.temp }}/weather-public-discovery.json
          RUN_SLOT: ${{ steps.slot.outputs.slot }}
          RECENT_HANDLES: ${{ steps.source_history.outputs.handles }}
          RECENT_URLS: ${{ steps.source_history.outputs.urls }}
        run: node tools/weather-public-discovery.mjs --target-date "$TARGET_DATE" --slot "$RUN_SLOT" --recent-handles "$RECENT_HANDLES" --recent-urls "$RECENT_URLS" --out "$RESULT_PATH"

      - name: Prepare public evidence candidates
        id: publish
        if: ${{ steps.guard.outputs.already_succeeded != 'true' }}
        uses: actions/github-script@v7
        env:
          RESULT_PATH: ${{ runner.temp }}/weather-public-discovery.json
          CANDIDATE_PATH: ${{ runner.temp }}/weather-scheduled-candidates.json
          WEEKLY_CANDIDATE_PATH: ${{ runner.temp }}/weather-scheduled-weekly-candidates.json
        with:
          script: |
            const fs = require('fs')
            const result = JSON.parse(fs.readFileSync(process.env.RESULT_PATH, 'utf8'))
            if (!result || ![1,3,4].includes(result.schemaVersion) || result.responseType !== 'weather-public-discovery' || !Array.isArray(result.candidates)) {
              core.setFailed('Invalid discovery result.')
              return
            }
            const usable = result.candidates.filter(c => {
              if (!c || !['x','web'].includes(c.sourceType)) return false
              if (c.sourceType === 'x') return /^https:\/\/x\.com\/i\/status\/\d+$/.test(c.sourceUrl || '')
              return /^https:\/\//.test(c.sourceUrl || '')
            }).slice(0, 24)
            const weeklyUsable = (Array.isArray(result.weeklyCandidates) ? result.weeklyCandidates : result.candidates).filter(c => {
              if (!c || !['x','web'].includes(c.sourceType)) return false
              if (c.sourceType === 'x') return /^https:\/\/x\.com\/i\/status\/\d+$/.test(c.sourceUrl || '')
              return /^https:\/\//.test(c.sourceUrl || '')
            }).slice(0, 24)
            fs.writeFileSync(process.env.CANDIDATE_PATH, JSON.stringify(usable), 'utf8')
            fs.writeFileSync(process.env.WEEKLY_CANDIDATE_PATH, JSON.stringify(weeklyUsable), 'utf8')
            core.setOutput('candidate_count', String(result.candidates.length))
            core.setOutput('usable_candidate_count', String(usable.length))
            core.setOutput('weekly_candidate_count', String(weeklyUsable.length))
            if (result.candidates.length === 0) core.setFailed('No public weather candidates found.')
            else if (usable.length === 0) core.setFailed('No supported public evidence candidate found.')

      - name: Capture and review current-slot weather
        id: capture
        if: ${{ success() && steps.guard.outputs.already_succeeded != 'true' }}
        shell: pwsh
        env:
          CANDIDATE_PATH: ${{ runner.temp }}/weather-scheduled-candidates.json
          WEEKLY_CANDIDATE_PATH: ${{ runner.temp }}/weather-scheduled-weekly-candidates.json
          TARGET_DATE: ${{ steps.slot.outputs.target_date }}
          SELECTED_DIR: ${{ runner.temp }}/weather-selected-evidence
          REVIEW_DRAFT: ${{ runner.temp }}/weather-unified-review.json
          RUN_SLOT: ${{ steps.slot.outputs.slot }}
        run: |
          $ErrorActionPreference = 'Continue'
          $expectedStartSlot = if ($env:RUN_SLOT -eq 'morning') { '06' } elseif ($env:RUN_SLOT -eq 'evening') { '18' } else { throw 'Invalid run slot.' }

          function Capture-Candidate {
            param([object]$Candidate, [string]$Dir)
            if (Test-Path $Dir) { Remove-Item -Recurse -Force $Dir }
            New-Item -ItemType Directory -Path $Dir -Force | Out-Null
            if ([string]$Candidate.sourceType -eq 'x') {
              & node tools/weather-x-embed-evidence.mjs --url ([string]$Candidate.sourceUrl) --output-dir $Dir
            } elseif ([string]$Candidate.sourceType -eq 'web') {
              & node tools/weather-cloud-url-evidence.mjs --url ([string]$Candidate.sourceUrl) --output-dir $Dir
            } else { return $false }
            if ($LASTEXITCODE -ne 0) { return $false }
            try {
              ./tools/weather-cloud-discovery.ps1 `
                -CapturePath (Join-Path $Dir 'capture.json') `
                -OutputPath (Join-Path $Dir 'discovery-candidate.json') `
                -DiscoverySource ([string]$Candidate.discoverySource) `
                -SearchQuery ([string]$Candidate.searchQuery)
            } catch { return $false }
            return $true
          }

          $dailyCandidates = @(Get-Content -LiteralPath $env:CANDIDATE_PATH -Raw -Encoding UTF8 | ConvertFrom-Json)
          $weeklyCandidates = @(Get-Content -LiteralPath $env:WEEKLY_CANDIDATE_PATH -Raw -Encoding UTF8 | ConvertFrom-Json)
          $dailySelected = $null
          $dailyDir = ''
          $dailyReviewPath = ''

          for ($i = 0; $i -lt $dailyCandidates.Count; $i++) {
            $candidate = $dailyCandidates[$i]
            $dir = Join-Path $env:RUNNER_TEMP ("weather-daily-candidate-" + $i)
            if (-not (Capture-Candidate -Candidate $candidate -Dir $dir)) { continue }
            $reviewPath = Join-Path $dir 'daily-only-review.json'
            & node tools/weather-direct-daily-panel-review.mjs --capture-dir $dir --target-date $env:TARGET_DATE --output $reviewPath
            if ($LASTEXITCODE -ne 0) { continue }
            try {
              $review = Get-Content -LiteralPath $reviewPath -Raw -Encoding UTF8 | ConvertFrom-Json
              $startSlot = [string]$review.interpretation.startSlot
              $slots = @($review.interpretation.slots)
              $ready = $review.ready -eq $true -and
                [string]$review.targetDate -ceq $env:TARGET_DATE -and
                [string]$review.interpretation.observedDate -ceq $env:TARGET_DATE -and
                $startSlot -ceq $expectedStartSlot -and
                $slots.Count -eq 5 -and
                @($slots | Where-Object { $_.visible -ne $true -or $_.confidence -cne 'high' -or @($_.weather | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) }).Count -lt 1 }).Count -eq 0
            } catch { $ready = $false }
            if ($ready) {
              $dailySelected = $candidate
              $dailyDir = $dir
              $dailyReviewPath = $reviewPath
              Write-Host "Select verified current-slot daily evidence from $([string]$candidate.sourceUrl) start=$startSlot."
              break
            }
          }
          if ($null -eq $dailySelected) { throw 'No captured public candidate produced current-slot daily weather.' }

          $weeklySelected = $null
          $weeklyDir = ''
          $weeklyReviewPath = ''

          # First see whether the selected daily post itself also contains a valid
          # weekly panel. If not, search weekly evidence independently.
          $sameWeeklyPath = Join-Path $dailyDir 'weekly-only-review.json'
          & node tools/weather-weekly-screenshot-review.mjs --capture-dir $dailyDir --target-date $env:TARGET_DATE --output $sameWeeklyPath
          if ($LASTEXITCODE -eq 0) {
            try {
              $sameWeekly = Get-Content -LiteralPath $sameWeeklyPath -Raw -Encoding UTF8 | ConvertFrom-Json
              if ($sameWeekly.ready -eq $true -and @($sameWeekly.interpretation.days).Count -ge 5) {
                $weeklySelected = $dailySelected
                $weeklyDir = $dailyDir
                $weeklyReviewPath = $sameWeeklyPath
              }
            } catch {}
          }

          if ($null -eq $weeklySelected) {
            for ($i = 0; $i -lt $weeklyCandidates.Count; $i++) {
              $candidate = $weeklyCandidates[$i]
              if ([string]$candidate.sourceUrl -ceq [string]$dailySelected.sourceUrl) { continue }
              $dir = Join-Path $env:RUNNER_TEMP ("weather-weekly-candidate-" + $i)
              if (-not (Capture-Candidate -Candidate $candidate -Dir $dir)) { continue }
              $reviewPath = Join-Path $dir 'weekly-only-review.json'
              & node tools/weather-weekly-screenshot-review.mjs --capture-dir $dir --target-date $env:TARGET_DATE --output $reviewPath
              if ($LASTEXITCODE -ne 0) { continue }
              try {
                $weeklyReview = Get-Content -LiteralPath $reviewPath -Raw -Encoding UTF8 | ConvertFrom-Json
                $days = @($weeklyReview.interpretation.days)
                $ready = $weeklyReview.ready -eq $true -and [string]$weeklyReview.targetDate -ceq $env:TARGET_DATE -and
                  $days.Count -ge 5 -and $days.Count -le 7 -and
                  @($days | Where-Object { $_.visible -ne $true -or $_.confidence -cne 'high' -or @($_.weather | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) }).Count -lt 1 }).Count -eq 0
              } catch { $ready = $false }
              if ($ready) {
                $weeklySelected = $candidate
                $weeklyDir = $dir
                $weeklyReviewPath = $reviewPath
                Write-Host "Select verified weekly evidence from $([string]$candidate.sourceUrl) days=$($days.Count)."
                break
              }
            }
          }

          if (Test-Path $env:SELECTED_DIR) { Remove-Item -Recurse -Force $env:SELECTED_DIR }
          $selectionMode = 'daily-only'
          $weeklySourceUrl = ''
          if ($null -ne $weeklySelected) {
            & node tools/weather-cross-source-compose.mjs `
              --daily-dir $dailyDir `
              --daily-review $dailyReviewPath `
              --weekly-dir $weeklyDir `
              --weekly-review $weeklyReviewPath `
              --output-dir $env:SELECTED_DIR `
              --target-date $env:TARGET_DATE
            if ($LASTEXITCODE -ne 0) { throw 'Cross-source daily+weekly evidence composition failed.' }
            Copy-Item -LiteralPath (Join-Path $env:SELECTED_DIR 'review.json') -Destination $env:REVIEW_DRAFT -Force
            $selectionMode = if ([string]$weeklySelected.sourceUrl -ceq [string]$dailySelected.sourceUrl) { 'daily-weekly-same-source' } else { 'daily-weekly-cross-source' }
            $weeklySourceUrl = [string]$weeklySelected.sourceUrl
          } else {
            Copy-Item -LiteralPath $dailyReviewPath -Destination $env:REVIEW_DRAFT -Force
            Move-Item -LiteralPath $dailyDir -Destination $env:SELECTED_DIR
            Write-Host "No verified weekly evidence found; keep existing weekly forecast and submit verified daily only."
          }

          $global:LASTEXITCODE = 0
          "selected_dir=$env:SELECTED_DIR" >> $env:GITHUB_OUTPUT
          "selected_source_url=$([string]$dailySelected.sourceUrl)" >> $env:GITHUB_OUTPUT
          "selected_source_handle=$([string]$dailySelected.sourceHandle)" >> $env:GITHUB_OUTPUT
          "weekly_source_url=$weeklySourceUrl" >> $env:GITHUB_OUTPUT
          "selection_mode=$selectionMode" >> $env:GITHUB_OUTPUT

      - name: Upload failed candidate diagnostics
        if: ${{ always() && steps.guard.outputs.already_succeeded != 'true' && steps.capture.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: weather-scheduled-failure-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/weather-daily-candidate-*
            ${{ runner.temp }}/weather-weekly-candidate-*
          if-no-files-found: warn
          retention-days: 3

      - name: Upload exact captured evidence artifact
        id: upload
        if: ${{ success() && steps.capture.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: weather-scheduled-evidence-${{ github.run_id }}
          path: ${{ steps.capture.outputs.selected_dir }}
          if-no-files-found: error
          retention-days: 7

      - name: Bind unified review to immutable artifact
        id: bind
        if: ${{ success() && steps.upload.outcome == 'success' }}
        shell: pwsh
        env:
          REVIEW_DRAFT: ${{ runner.temp }}/weather-unified-review.json
          REVIEW_ENVELOPE: ${{ runner.temp }}/weather-review-envelope.json
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_NAME: weather-scheduled-evidence-${{ github.run_id }}
        run: >-
          node tools/weather-unified-bind.mjs
          --draft "$env:REVIEW_DRAFT"
          --artifact-run-id "${{ github.run_id }}"
          --artifact-id "$env:ARTIFACT_ID"
          --artifact-name "$env:ARTIFACT_NAME"
          --output "$env:REVIEW_ENVELOPE"

      - name: Verify artifact hashes and build daily candidate
        id: bridge
        if: ${{ success() && steps.bind.outcome == 'success' }}
        shell: pwsh
        env:
          REVIEW_PAYLOAD_BASE64: ${{ steps.bind.outputs.review_payload_base64 }}
          REVIEW_PATH: ${{ runner.temp }}/weather-artifact-review.json
          RESULT_DIR: ${{ runner.temp }}/weather-reviewed-result
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_NAME: weather-scheduled-evidence-${{ github.run_id }}
        run: |
          ./tools/weather-artifact-review-request.ps1 -ReviewPayloadBase64 "$env:REVIEW_PAYLOAD_BASE64" -ReviewPath "$env:REVIEW_PATH"
          ./tools/weather-artifact-review-bridge.ps1 `
            -ReviewPath "$env:REVIEW_PATH" `
            -ArtifactDirectory "${{ steps.capture.outputs.selected_dir }}" `
            -DownloadedArtifactId "$env:ARTIFACT_ID" `
            -DownloadedArtifactName "$env:ARTIFACT_NAME" `
            -DownloadedArtifactRunId "${{ github.run_id }}" `
            -CandidatePath "$env:RESULT_DIR/weather-candidate.json" `
            -DryRunPath "$env:RESULT_DIR/weather-dry-run.json" `
            -PendingPreviewPath "$env:RESULT_DIR/pending-preview.json"
          if ("${{ steps.bridge.outputs.pending_prepared }}" -eq 'false') { throw 'Daily pending preview was not prepared.' }

      - name: Register verified weather as one pending
        id: submit
        if: ${{ success() && steps.bridge.outcome == 'success' && steps.slot.outputs.dry_run != 'true' }}
        shell: pwsh
        env:
          WEATHER_POST_KEY: ${{ secrets.WEATHER_POST_KEY }}
          WEATHER_ADMIN_KEY: ${{ secrets.WEATHER_ADMIN_KEY }}
          RESULT_DIR: ${{ runner.temp }}/weather-reviewed-result
          REVIEW_ENVELOPE: ${{ runner.temp }}/weather-review-envelope.json
        run: >-
          ./tools/weather-cloud-submit-unified.ps1
          -CandidatePath "$env:RESULT_DIR/weather-candidate.json"
          -CapturePath "${{ steps.bridge.outputs.capture_path }}"
          -EvidencePath "${{ steps.bridge.outputs.evidence_path }}"
          -ReviewPath "$env:REVIEW_ENVELOPE"
          -ResultPath "$env:RESULT_DIR/submit-result.json"

      - name: Finalize slot state
        id: finalize
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          ALREADY_SUCCEEDED: ${{ steps.guard.outputs.already_succeeded }}
          RUN_KEY: ${{ steps.slot.outputs.run_key }}
          SLOT: ${{ steps.slot.outputs.slot }}
          IS_SNOOZE: ${{ steps.slot.outputs.is_snooze }}
          ORIGIN: ${{ steps.slot.outputs.origin }}
          ATTEMPT_KIND: ${{ steps.slot.outputs.attempt_kind }}
          DRY_RUN: ${{ steps.slot.outputs.dry_run }}
          CANDIDATE_COUNT: ${{ steps.publish.outputs.candidate_count }}
          USABLE_COUNT: ${{ steps.publish.outputs.usable_candidate_count }}
          SUBMIT_OUTCOME: ${{ steps.submit.outcome }}
          REPORT_ID: ${{ steps.submit.outputs.report_id }}
          CONTENT_DUPLICATE: ${{ steps.submit.outputs.duplicate }}
          PENDING_REGISTERED: ${{ steps.submit.outputs.pending_registered }}
          WEEKLY_COUNT: ${{ steps.submit.outputs.weekly_count || steps.bind.outputs.weekly_count }}
          SOURCE_URL: ${{ steps.capture.outputs.selected_source_url }}
          SOURCE_HANDLE: ${{ steps.capture.outputs.selected_source_handle }}
          WEEKLY_SOURCE_URL: ${{ steps.capture.outputs.weekly_source_url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            if (process.env.ALREADY_SUCCEEDED === 'true') {
              core.setOutput('terminal_success', 'true')
              core.setOutput('new_pending', 'false')
              core.setOutput('notify_failure', 'false')
              return
            }
            if (process.env.DRY_RUN === 'true') {
              core.notice(`Dry-run completed for ${process.env.RUN_KEY}; no pending, issue, or Discord notification was created.`)
              core.setOutput('terminal_success', 'true')
              core.setOutput('new_pending', 'false')
              core.setOutput('notify_failure', 'false')
              core.setOutput('report_id', '')
              return
            }
            const submitSucceeded = process.env.SUBMIT_OUTCOME === 'success' && (process.env.PENDING_REGISTERED === 'true' || process.env.CONTENT_DUPLICATE === 'true')
            const terminalSuccess = submitSucceeded
            const origin = process.env.ORIGIN || 'unknown'
            const attemptKind = process.env.ATTEMPT_KIND || 'unknown'
            const successMarker = terminalSuccess ? `<!-- heartopia-weather-scheduled-success:${process.env.RUN_KEY} -->` : ''
            const failureMarker = terminalSuccess ? '' : `<!-- heartopia-weather-failure:${process.env.RUN_KEY}:${origin}:${attemptKind} -->`
            let notifyFailure = false
            if (!terminalSuccess) {
              if (origin === 'manual') notifyFailure = true
              else if (origin === 'apps-script' && attemptKind === 'retry') notifyFailure = true
              else if (origin === 'github-backup') {
                const retryMarker = `<!-- heartopia-weather-failure:${process.env.RUN_KEY}:apps-script:retry -->`
                const { data } = await github.rest.issues.listForRepo({ ...context.repo, state:'all', per_page:100, sort:'created', direction:'desc' })
                notifyFailure = !data.some(issue => !issue.pull_request && typeof issue.body === 'string' && issue.body.includes(retryMarker))
              }
            }
            const record = {
              schemaVersion: 4,
              responseType: 'weather-scheduled-result',
              runKey: process.env.RUN_KEY,
              slot: process.env.SLOT,
              snooze: process.env.IS_SNOOZE === 'true',
              origin,
              attemptKind,
              status: terminalSuccess ? (process.env.CONTENT_DUPLICATE === 'true' ? 'content-duplicate' : 'pending') : 'failed',
              candidateCount: Number(process.env.CANDIDATE_COUNT || 0),
              usableCandidateCount: Number(process.env.USABLE_COUNT || 0),
              weeklyCount: Number(process.env.WEEKLY_COUNT || 0),
              sourceUrl: process.env.SOURCE_URL || '',
              sourceHandle: process.env.SOURCE_HANDLE || '',
              weeklySourceUrl: process.env.WEEKLY_SOURCE_URL || '',
              reportId: process.env.REPORT_ID || '',
              duplicate: process.env.CONTENT_DUPLICATE === 'true',
              runUrl: process.env.RUN_URL
            }
            const body = [successMarker, failureMarker, '<!-- heartopia-weather-scheduled-v4 -->', '```json', JSON.stringify(record), '```'].filter(Boolean).join('\n')
            const issue = await github.rest.issues.create({ ...context.repo, title:`[weather-scheduled-result] ${process.env.RUN_KEY}`, body })
            await github.rest.issues.update({ ...context.repo, issue_number:issue.data.number, state:'closed', state_reason:'completed' })
            core.setOutput('terminal_success', terminalSuccess ? 'true' : 'false')
            core.setOutput('new_pending', submitSucceeded && process.env.CONTENT_DUPLICATE !== 'true' ? 'true' : 'false')
            core.setOutput('report_id', process.env.REPORT_ID || '')
            core.setOutput('notify_failure', notifyFailure ? 'true' : 'false')
            if (!terminalSuccess) core.setFailed('Scheduled weather run did not reach a verified current-slot pending or known content duplicate.')

      - name: Notify Discord about a new pending
        if: ${{ always() && steps.finalize.outputs.new_pending == 'true' && env.WEATHER_DC_WEBHOOK_URL != '' }}
        shell: pwsh
        env:
          REPORT_ID: ${{ steps.finalize.outputs.report_id }}
        run: |
          $adminUrl = "https://sg-log.github.io/heartopia-daily/?admin=1&pending=$env:REPORT_ID#pendingWeatherReports"
          $payload = @{ content = "🌤️ Heartopiaの天気pendingが届いたよ。`n確認・承認する ↓`n$adminUrl"; allowed_mentions = @{ parse = @() } } | ConvertTo-Json -Depth 5 -Compress
          Invoke-RestMethod -Method Post -Uri $env:WEATHER_DC_WEBHOOK_URL -ContentType 'application/json' -Body $payload | Out-Null

      - name: Notify Discord after terminal failure
        if: ${{ always() && steps.finalize.outputs.terminal_success != 'true' && steps.finalize.outputs.notify_failure == 'true' && env.WEATHER_DC_WEBHOOK_URL != '' }}
        shell: pwsh
        env:
          RUN_KEY: ${{ steps.slot.outputs.run_key }}
          ORIGIN: ${{ steps.slot.outputs.origin }}
          ATTEMPT_KIND: ${{ steps.slot.outputs.attempt_kind }}
          WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/workflows/weather-scheduled-run.yml
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ($env:ORIGIN -eq 'manual') { $headline = "⚠️ Heartopia天気の手動更新が失敗しました。" }
          elseif ($env:ORIGIN -eq 'apps-script' -and $env:ATTEMPT_KIND -eq 'retry') { $headline = "⚠️ Heartopia天気 $env:RUN_KEY は自動の通常便＋再試行でも更新できませんでした。" }
          else { $headline = "⚠️ Heartopia天気 $env:RUN_KEY はバックアップ便でも更新できませんでした。" }
          $message = "$headline`n手動で再実行できます。`n手動Run ↓`n$env:WORKFLOW_URL`n今回のRun ↓`n$env:RUN_URL"
          $payload = @{ content = $message; allowed_mentions = @{ parse = @() } } | ConvertTo-Json -Depth 5 -Compress
          Invoke-RestMethod -Method Post -Uri $env:WEATHER_DC_WEBHOOK_URL -ContentType 'application/json' -Body $payload | Out-Null
