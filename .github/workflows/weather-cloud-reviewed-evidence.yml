name: Weather cloud reviewed evidence

on:
  workflow_dispatch:
    inputs:
      review_payload_base64:
        description: Base64 UTF-8 Work review envelope bound to one evidence artifact
        required: true
        type: string
      submit_pending:
        description: Register one verified pending report after all gates pass
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      review_payload_base64:
        description: Validated Base64 UTF-8 Work review envelope
        required: true
        type: string
      submit_pending:
        description: Register one verified pending report after all gates pass
        required: true
        type: boolean
    secrets:
      WEATHER_POST_KEY:
        required: false
      WEATHER_ADMIN_KEY:
        required: false
    outputs:
      report_id:
        value: ${{ jobs.validate.outputs.report_id }}
      duplicate:
        value: ${{ jobs.validate.outputs.duplicate }}
      pending_registered:
        value: ${{ jobs.validate.outputs.pending_registered }}
      drive_saved:
        value: ${{ jobs.validate.outputs.drive_saved }}
      sha256_match:
        value: ${{ jobs.validate.outputs.sha256_match }}
      capture_sha256:
        value: ${{ jobs.validate.outputs.capture_sha256 }}
      stage2_refetch_sha256:
        value: ${{ jobs.validate.outputs.stage2_refetch_sha256 }}
      review_storage_sha256:
        value: ${{ jobs.validate.outputs.review_storage_sha256 }}
      pending_evidence_source:
        value: ${{ jobs.validate.outputs.pending_evidence_source }}
      review_scope:
        value: ${{ jobs.validate.outputs.review_scope }}
      result_artifact_id:
        value: ${{ jobs.validate.outputs.result_artifact_id }}
      result_artifact_name:
        value: ${{ jobs.validate.outputs.result_artifact_name }}

permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      report_id: ${{ steps.submit.outputs.report_id }}
      duplicate: ${{ steps.submit.outputs.duplicate }}
      pending_registered: ${{ steps.submit.outputs.pending_registered }}
      drive_saved: ${{ steps.submit.outputs.drive_saved }}
      sha256_match: ${{ steps.bridge.outputs.sha256_match }}
      capture_sha256: ${{ steps.bridge.outputs.capture_sha256 }}
      stage2_refetch_sha256: ${{ steps.bridge.outputs.stage2_refetch_sha256 }}
      review_storage_sha256: ${{ steps.bridge.outputs.review_storage_sha256 }}
      pending_evidence_source: ${{ steps.bridge.outputs.pending_evidence_source }}
      review_scope: ${{ steps.bridge.outputs.review_scope }}
      result_artifact_id: ${{ steps.result_artifact.outputs.artifact-id }}
      result_artifact_name: weather-reviewed-result-${{ github.run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test review and pending submit bridges
        shell: pwsh
        run: |
          ./tools/test-weather-work-review.ps1
          ./tools/test-weather-cloud-submit.ps1

      - name: Validate Work review envelope
        id: review
        shell: pwsh
        env:
          REVIEW_PAYLOAD_BASE64: ${{ inputs.review_payload_base64 }}
        run: >-
          ./tools/weather-work-review-request.ps1
          -ReviewPayloadBase64 "$env:REVIEW_PAYLOAD_BASE64"
          -ReviewPath "$env:RUNNER_TEMP/weather-work-review.json"

      - name: Verify immutable artifact identity
        uses: actions/github-script@v7
        env:
          ARTIFACT_ID: ${{ steps.review.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ steps.review.outputs.artifact_name }}
          ARTIFACT_RUN_ID: ${{ steps.review.outputs.artifact_run_id }}
        with:
          script: |
            const artifactId = Number(process.env.ARTIFACT_ID)
            const runId = Number(process.env.ARTIFACT_RUN_ID)
            const { data } = await github.rest.actions.getArtifact({
              ...context.repo,
              artifact_id: artifactId
            })
            if (data.expired || data.id !== artifactId || data.name !== process.env.ARTIFACT_NAME || data.workflow_run?.id !== runId) {
              core.setFailed('Work review artifact identifiers do not resolve to the same immutable artifact.')
            }

      - name: Download the exact reviewed artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.review.outputs.artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.review.outputs.artifact_run_id }}
          path: ${{ runner.temp }}/weather-reviewed-evidence

      - name: Re-fetch selected public media for Stage2 identity verification
        if: ${{ steps.review.outputs.review_mode == 'public-media-url-visual' }}
        shell: pwsh
        env:
          MEDIA_URL: ${{ steps.review.outputs.media_url }}
        run: >-
          node tools/weather-x-raw-media.mjs
          --url "$env:MEDIA_URL"
          --output "$env:RUNNER_TEMP/weather-stage2-refetched-media.bin"

      - name: Verify SHA and build existing candidate
        id: bridge
        shell: pwsh
        run: >-
          ./tools/weather-work-review-bridge.ps1
          -ReviewPath "$env:RUNNER_TEMP/weather-work-review.json"
          -ArtifactDirectory "$env:RUNNER_TEMP/weather-reviewed-evidence"
          -DownloadedArtifactId "${{ steps.review.outputs.artifact_id }}"
          -DownloadedArtifactName "${{ steps.review.outputs.artifact_name }}"
          -DownloadedArtifactRunId "${{ steps.review.outputs.artifact_run_id }}"
          -CandidatePath "$env:RUNNER_TEMP/weather-reviewed-result/weather-candidate.json"
          -DryRunPath "$env:RUNNER_TEMP/weather-reviewed-result/weather-dry-run.json"
          -PendingPreviewPath "$env:RUNNER_TEMP/weather-reviewed-result/pending-preview.json"
          -RefetchedMediaPath "$env:RUNNER_TEMP/weather-stage2-refetched-media.bin"

      - name: Register one verified candidate as pending
        id: submit
        if: ${{ inputs.submit_pending && steps.bridge.outputs.sha256_match == 'true' && steps.bridge.outputs.ready == 'true' && steps.bridge.outputs.pending_prepared == 'true' }}
        shell: pwsh
        env:
          WEATHER_POST_KEY: ${{ secrets.WEATHER_POST_KEY }}
          WEATHER_ADMIN_KEY: ${{ secrets.WEATHER_ADMIN_KEY }}
        run: >-
          ./tools/weather-cloud-submit.ps1
          -CandidatePath "$env:RUNNER_TEMP/weather-reviewed-result/weather-candidate.json"
          -CapturePath "${{ steps.bridge.outputs.capture_path }}"
          -EvidencePath "${{ steps.bridge.outputs.evidence_path }}"
          -ResultPath "$env:RUNNER_TEMP/weather-reviewed-result/submit-result.json"

      - name: Upload validated handoff result
        id: result_artifact
        if: ${{ always() && steps.bridge.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: weather-reviewed-result-${{ github.run_id }}
          path: ${{ runner.temp }}/weather-reviewed-result
          if-no-files-found: error
          retention-days: 7
