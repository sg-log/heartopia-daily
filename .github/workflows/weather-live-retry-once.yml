name: Weather live retry once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/weather-live-retry-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-production:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch real production weather workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'weather-scheduled-run.yml',
              ref: 'main',
              inputs: {
                slot: 'evening',
                target_date: '2026-09-17',
                trigger_origin: 'manual',
                attempt_kind: 'manual'
              }
            })
            core.notice('Dispatched real production weather workflow for 2026-09-17 evening.')
