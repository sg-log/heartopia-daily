name: Weather authoritative UI fix v2

on:
  push:
    branches:
      - fix/weather-authoritative-ui-gate-20260917
    paths:
      - '.github/workflows/weather-authoritative-ui-fix-v2.yml'

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/weather-authoritative-ui-gate-20260917
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Apply safety patch
        run: python tools/apply-weather-authoritative-fix.py
      - name: Run focused regression tests
        run: node --test tools/test-weather-unified-review.mjs tools/test-weather-x-embed-evidence.mjs
      - name: Live fixture must select exact-status weather media
        shell: bash
        run: |
          rm -rf /tmp/weather-live
          mkdir -p /tmp/weather-live
          node tools/weather-x-embed-evidence.mjs --url https://x.com/i/status/2100325752185159960 --output-dir /tmp/weather-live
          node tools/weather-unified-review.mjs --mode inspect --capture-dir /tmp/weather-live --target-date 2026-09-17 --output /tmp/weather-review.json
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('/tmp/weather-live/capture.json','utf8'));const r=JSON.parse(fs.readFileSync('/tmp/weather-review.json','utf8'));const exact=c.rawMedia.filter(x=>x.sourceScope==='exact-status');if(!exact.length)throw new Error('No exact-status media');if(!r.ready)throw new Error('Live review not ready');if(!String(r.selectedImage?.file||'').startsWith('status-media-'))throw new Error('Unsafe selected image '+r.selectedImage?.file);console.log(JSON.stringify({exact:exact.map(x=>x.file),selected:r.selectedImage.file,start:r.interpretation?.startSlot,slots:r.interpretation?.slots?.map(s=>s.weather),weekly:r.interpretation?.weeklyDays?.map(d=>d.weather)}));"
      - name: Commit tested patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/weather-x-embed-evidence.mjs tools/weather-unified-review.mjs tools/weather-deterministic-review.mjs tools/test-weather-unified-review.mjs
          git commit -m 'Require authoritative weather UI evidence'
          git push origin HEAD:fix/weather-authoritative-ui-gate-20260917
