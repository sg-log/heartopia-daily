name: Weather artifact direct review branch test

on:
  push:
    branches:
      - feature/weather-artifact-direct-review
    paths:
      - .github/workflows/weather-artifact-direct-review-branch-test.yml

permissions:
  actions: read
  contents: read

jobs:
  dry_run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run direct artifact review unit tests
        shell: pwsh
        run: |
          ./tools/test-weather-artifact-review.ps1
          ./tools/test-weather-artifact-issue-request.ps1

      - name: Validate real Issue 13 review envelope
        shell: pwsh
        run: |
          $review = [ordered]@{
            schemaVersion = 4
            artifact = [ordered]@{
              runId = '34870529944'
              id = '10358184684'
              name = 'weather-x-embed-evidence-34870529944'
            }
            reviewedImages = @(
              [ordered]@{
                file = 'raw-media-0.jpg'
                mimeType = 'image/jpeg'
                captureSha256 = 'f015010e63a3527d06defc16a3230a584ee8392a2642f6858fc535064d777305'
              },
              [ordered]@{
                file = 'raw-media-1.jpg'
                mimeType = 'image/jpeg'
                captureSha256 = '97105c5dbd43a17b6927bd81a11731ca13e15632684af2bee82d0f2b07cce57e'
              }
            )
            pendingEvidenceFile = 'raw-media-1.jpg'
            interpretation = [ordered]@{
              ready = $true
              observedDate = '2026-09-14'
              startSlot = '06'
              confidence = 'high'
              summary = 'Scheduled review of both captured raw media images.'
              unresolved = @()
              slots = @(
                [ordered]@{slot='slot0';visible=$true;weather=@('晴');confidence='high';description='06 sun'},
                [ordered]@{slot='slot1';visible=$true;weather=@('雨');confidence='high';description='12 rain'},
                [ordered]@{slot='slot2';visible=$true;weather=@('晴');confidence='high';description='18 clear'},
                [ordered]@{slot='slot3';visible=$true;weather=@('晴');confidence='high';description='00 clear'},
                [ordered]@{slot='slot4';visible=$true;weather=@('晴');confidence='high';description='next 06 sun'}
              )
            }
          }
          $json = $review | ConvertTo-Json -Depth 30 -Compress
          $payload = [Convert]::ToBase64String([Text.UTF8Encoding]::new($false).GetBytes($json))
          ./tools/weather-review-request.ps1 `
            -ReviewPayloadBase64 $payload `
            -ReviewPath "$env:RUNNER_TEMP/weather-review.json" | Out-Null

      - name: Download exact Issue 13 artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '10358184684'
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '34870529944'
          path: ${{ runner.temp }}/weather-reviewed-evidence

      - name: Build candidate and pending preview without submit
        shell: pwsh
        run: |
          ./tools/weather-review-bridge.ps1 `
            -ReviewPath "$env:RUNNER_TEMP/weather-review.json" `
            -ArtifactDirectory "$env:RUNNER_TEMP/weather-reviewed-evidence" `
            -DownloadedArtifactId '10358184684' `
            -DownloadedArtifactName 'weather-x-embed-evidence-34870529944' `
            -DownloadedArtifactRunId '34870529944' `
            -CandidatePath "$env:RUNNER_TEMP/weather-reviewed-result/weather-candidate.json" `
            -DryRunPath "$env:RUNNER_TEMP/weather-reviewed-result/weather-dry-run.json" `
            -PendingPreviewPath "$env:RUNNER_TEMP/weather-reviewed-result/pending-preview.json" | Out-Null

      - name: Assert real dry-run result
        shell: pwsh
        run: |
          $candidate = Get-Content -LiteralPath "$env:RUNNER_TEMP/weather-reviewed-result/weather-candidate.json" -Raw -Encoding UTF8 | ConvertFrom-Json
          $preview = Get-Content -LiteralPath "$env:RUNNER_TEMP/weather-reviewed-result/pending-preview.json" -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($candidate.hourlyForecast.status -cne 'ready') { throw 'Real candidate is not ready.' }
          if (@($candidate.aiReview.reviewedImages).Count -ne 2) { throw 'Both reviewed raw images were not recorded.' }
          if ($candidate.aiReview.verificationScope.visualReview -cne 'artifact-raw-media-images') { throw 'Wrong artifact visual review scope.' }
          if ($preview.status -cne 'preview' -or $preview.sent -ne $false) { throw 'Dry-run pending preview was not produced safely.' }
          if ($preview.payload.evidenceImages[0].sha256 -cne '97105c5dbd43a17b6927bd81a11731ca13e15632684af2bee82d0f2b07cce57e') { throw 'Pending evidence SHA does not match selected captured raw media.' }
          'PASS: real Issue 13 artifact -> schema v4 review -> candidate -> pending preview, no submit'

      - name: Upload dry-run result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: weather-artifact-direct-review-branch-test-${{ github.run_id }}
          path: ${{ runner.temp }}/weather-reviewed-result
          if-no-files-found: warn
          retention-days: 2
