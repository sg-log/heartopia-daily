name: Weather X media debug patch

on:
  push:
    paths:
      - '.github/workflows/weather-x-media-debug-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/weather-final-hardening-20260917
      - name: Add temporary capture diagnostics
        shell: python
        run: |
          from pathlib import Path
          p=Path('tools/weather-x-embed-evidence.mjs')
          s=p.read_text()
          old='''      postContent: { file: "post-content.txt" },\n      directPage: { file: "direct-page.png" },\n      rawMedia,'''
          new='''      postContent: { file: "post-content.txt" },\n      directPage: { file: "direct-page.png" },\n      debugImages: images,\n      debugObservedMediaUrls: observedMediaUrls,\n      rawMedia,'''
          if old not in s: raise SystemExit('debug anchor missing')
          p.write_text(s.replace(old,new))
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/weather-x-embed-evidence.mjs
          git commit -m 'Temporarily expose X embed media diagnostics'
          git push origin HEAD:fix/weather-final-hardening-20260917
