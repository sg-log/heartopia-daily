name: Weather cloud X official embed evidence

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Public X post URL to inspect through official embed services
        required: true
        type: string

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test X official embed adapter
        run: npm run test:weather-cloud-x-embed

      - name: Test AI candidate and submit bridges
        shell: pwsh
        run: |
          npm run test:weather-ai
          ./tools/test-weather-ai-candidate.ps1
          ./tools/test-weather-cloud-submit.ps1

      - name: Capture post through official embed services
        id: capture
        continue-on-error: true
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: >-
          npm run weather:cloud:x-embed --
          --url "$SOURCE_URL"
          --output-dir "$RUNNER_TEMP/weather-x-embed-evidence"

      - name: Build existing discovery candidate record
        if: ${{ always() }}
        shell: pwsh
        run: >-
          ./tools/weather-cloud-discovery.ps1
          -CapturePath "$env:RUNNER_TEMP/weather-x-embed-evidence/capture.json"
          -OutputPath "$env:RUNNER_TEMP/weather-x-embed-evidence/discovery-candidate.json"
          -DiscoverySource "x-official-embed"
          -SearchQuery "workflow_dispatch X official embed"

      - name: Interpret saved evidence image
        id: interpret
        if: ${{ steps.capture.outcome == 'success' }}
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WEATHER_AI_MODEL: ${{ vars.WEATHER_AI_MODEL || 'gpt-5.4-mini-2026-03-17' }}
        run: >-
          npm run weather:ai --
          --capture "$RUNNER_TEMP/weather-x-embed-evidence/capture.json"
          --evidence "$RUNNER_TEMP/weather-x-embed-evidence/evidence.jpg"
          --output "$RUNNER_TEMP/weather-x-embed-evidence/ai-interpretation.json"

      - name: Build and validate existing weather candidate
        id: candidate
        if: ${{ steps.interpret.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: >-
          ./tools/weather-ai-candidate.ps1
          -CapturePath "$env:RUNNER_TEMP/weather-x-embed-evidence/capture.json"
          -DiscoveryPath "$env:RUNNER_TEMP/weather-x-embed-evidence/discovery-candidate.json"
          -InterpretationPath "$env:RUNNER_TEMP/weather-x-embed-evidence/ai-interpretation.json"
          -EvidencePath "$env:RUNNER_TEMP/weather-x-embed-evidence/evidence.jpg"
          -CandidatePath "$env:RUNNER_TEMP/weather-x-embed-evidence/weather-candidate.json"
          -DryRunPath "$env:RUNNER_TEMP/weather-x-embed-evidence/weather-dry-run.json"

      - name: Register ready candidate as pending
        id: submit
        if: ${{ steps.candidate.outputs.ready == 'true' }}
        continue-on-error: true
        shell: pwsh
        env:
          WEATHER_POST_KEY: ${{ secrets.WEATHER_POST_KEY }}
          WEATHER_ADMIN_KEY: ${{ secrets.WEATHER_ADMIN_KEY }}
        run: >-
          ./tools/weather-cloud-submit.ps1
          -CandidatePath "$env:RUNNER_TEMP/weather-x-embed-evidence/weather-candidate.json"
          -CapturePath "$env:RUNNER_TEMP/weather-x-embed-evidence/capture.json"
          -EvidencePath "$env:RUNNER_TEMP/weather-x-embed-evidence/evidence.jpg"
          -ResultPath "$env:RUNNER_TEMP/weather-x-embed-evidence/submit-result.json"

      - name: Upload X embed evidence artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: weather-x-embed-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/weather-x-embed-evidence
          if-no-files-found: error
          retention-days: 7

      - name: Preserve stopped pipeline result
        if: ${{ always() && (steps.capture.outcome != 'success' || steps.interpret.outcome == 'failure' || steps.candidate.outcome == 'failure' || (steps.candidate.outputs.ready == 'true' && steps.submit.outcome != 'success')) }}
        run: exit 1
