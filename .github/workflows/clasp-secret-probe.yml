name: Clasp secret probe

on:
  push:
    paths:
      - '.github/workflows/clasp-secret-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      CLASP_TOKEN: ${{ secrets.CLASP_TOKEN }}
      GOOGLE_CLASP_TOKEN: ${{ secrets.GOOGLE_CLASP_TOKEN }}
      CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Report only whether candidate secrets exist
        shell: bash
        run: |
          for name in CLASPRC_JSON CLASP_TOKEN GOOGLE_CLASP_TOKEN CLASP_CREDENTIALS GOOGLE_SERVICE_ACCOUNT_JSON; do
            if [ -n "${!name}" ]; then
              echo "$name=present"
            else
              echo "$name=absent"
            fi
          done
