name: Gift code Discord poll

on:
  push:
    branches: [main]
    paths:
      - "tools/gift-x-backup.mjs"
      - "apps-script/gift-code-storage.gs"
  workflow_dispatch:
    inputs:
      channel_id:
        description: "Discord channel ID to poll"
        required: true
        type: string
      mode:
        description: "Connection test or normal poll"
        required: true
        type: choice
        options: [poll, test]
        default: poll

permissions:
  contents: read

concurrency:
  group: gift-code-discord-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Poll Discord gift channel
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DISCORD_GIFT_BOT_TOKEN: ${{ secrets.DISCORD_GIFT_BOT_TOKEN }}
          WEATHER_POST_KEY: ${{ secrets.WEATHER_POST_KEY }}
          DISCORD_GIFT_CHANNEL_ID: ${{ inputs.channel_id }}
          GIFT_POLL_MODE: ${{ inputs.mode }}
        run: node tools/gift-discord-poll.mjs

      - name: Poll official X backup
        id: gift_x
        if: ${{ always() }}
        continue-on-error: true
        env:
          WEATHER_POST_KEY: ${{ secrets.WEATHER_POST_KEY }}
          WEATHER_DC_WEBHOOK_URL: ${{ secrets.WEATHER_DC_WEBHOOK_URL }}
          GIFT_X_FORCE: ${{ github.event_name == 'push' && '1' || '0' }}
          GIFT_POLL_MODE: ${{ inputs.mode }}
        run: node tools/gift-x-backup.mjs

      - name: Prepare private evidence capture
        if: ${{ steps.gift_x.outputs.evidence_needed == 'true' }}
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Capture private gift evidence
        if: ${{ steps.gift_x.outputs.evidence_needed == 'true' }}
        continue-on-error: true
        env:
          WEATHER_POST_KEY: ${{ secrets.WEATHER_POST_KEY }}
          GIFT_CAPTURE_ONLY: "1"
        run: node tools/gift-x-backup.mjs
