name: Weather safe source pool dry run

on:
  push:
    branches: [fix/weather-authoritative-ui-gate-20260917]
    paths:
      - '.github/workflows/weather-safe-source-pool-dryrun.yml'
      - 'tools/weather-public-discovery.mjs'

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/weather-authoritative-ui-gate-20260917
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Regression tests
        run: node --test tools/test-weather-unified-review.mjs tools/test-weather-x-embed-evidence.mjs
      - name: Discover public WEB candidates
        run: node tools/weather-public-discovery.mjs --target-date 2026-09-17 --out /tmp/discovery.json
      - name: Assert broad discovery routes stay enabled
        shell: pwsh
        run: |
          $discovery = Get-Content /tmp/discovery.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($discovery.schemaVersion -ne 3) { throw ("Unexpected discovery schema " + $discovery.schemaVersion) }
          $providers = @($discovery.attempts | ForEach-Object { [string]$_.provider } | Sort-Object -Unique)
          foreach ($required in @('bing','duckduckgo','yahoo-web','yahoo-realtime')) {
            if ($providers -notcontains $required) { throw ("Missing discovery route: " + $required) }
          }
          $badSearchPage = @($discovery.candidates | Where-Object {
            $u = [string]$_.sourceUrl
            $u -match '^https://(www\.)?(bing\.com|duckduckgo\.com|search\.yahoo\.co\.jp)/'
          })
          if ($badSearchPage.Count -gt 0) { throw 'Search result pages must not become evidence candidates' }
          Write-Host ('BROAD_DISCOVERY_OK candidates=' + @($discovery.candidates).Count + ' providers=' + ($providers -join ','))
      - name: Try diversified public sources without submitting
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $all = (Get-Content /tmp/discovery.json -Raw -Encoding UTF8 | ConvertFrom-Json).candidates
          $candidates = @($all | Select-Object -First 24)
          $results = @()
          $selected = $null
          for ($i = 0; $i -lt $candidates.Count; $i++) {
            $candidate = $candidates[$i]
            $dir = Join-Path $env:RUNNER_TEMP ("safe-source-" + $i)
            if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            $captureOk = $false
            try {
              if ([string]$candidate.sourceType -eq 'x') {
                & node tools/weather-x-embed-evidence.mjs --url ([string]$candidate.sourceUrl) --output-dir $dir
              } else {
                & node tools/weather-cloud-url-evidence.mjs --url ([string]$candidate.sourceUrl) --output-dir $dir
              }
              $captureOk = ($LASTEXITCODE -eq 0)
            } catch {}
            if (-not $captureOk) {
              $results += [pscustomobject]@{ index=$i; url=[string]$candidate.sourceUrl; type=[string]$candidate.sourceType; platform=[string]$candidate.sourcePlatform; capture=$false; ready=$false; reason='capture-failed' }
              continue
            }
            try {
              ./tools/weather-cloud-discovery.ps1 -CapturePath (Join-Path $dir 'capture.json') -OutputPath (Join-Path $dir 'discovery-candidate.json') -DiscoverySource ([string]$candidate.discoverySource) -SearchQuery ([string]$candidate.searchQuery)
            } catch {
              $results += [pscustomobject]@{ index=$i; url=[string]$candidate.sourceUrl; type=[string]$candidate.sourceType; platform=[string]$candidate.sourcePlatform; capture=$true; ready=$false; reason='discovery-bind-failed' }
              continue
            }
            $out = Join-Path $dir 'review.json'
            & node tools/weather-unified-review.mjs --mode inspect --capture-dir $dir --target-date 2026-09-17 --output $out
            $reviewExit = $LASTEXITCODE
            $review = $null
            if (Test-Path $out) { try { $review = Get-Content $out -Raw -Encoding UTF8 | ConvertFrom-Json } catch {} }
            $ready = ($reviewExit -eq 0 -and $null -ne $review -and $review.ready -eq $true)
            $reason = ''
            if ($null -ne $review) {
              $reason = [string]($review.diagnostics.reason)
              if (-not $reason -and $null -ne $review.diagnostics.verifiedPanel -and -not $review.diagnostics.verifiedPanel.ready) { $reason = [string]$review.diagnostics.verifiedPanel.reason }
              if (-not $reason -and $null -ne $review.diagnostics.splitFallback) { $reason = 'split-not-ready' }
            }
            $results += [pscustomobject]@{
              index=$i; url=[string]$candidate.sourceUrl; type=[string]$candidate.sourceType; platform=[string]$candidate.sourcePlatform;
              capture=$true; ready=$ready; reason=$reason; selectedImage=[string]($review.selectedImage.file);
              startSlot=[string]($review.interpretation.startSlot); slots=@($review.interpretation.slots | ForEach-Object { @($_.weather) -join '+' });
              weekly=@($review.interpretation.weeklyDays | ForEach-Object { @($_.weather) -join '+' })
            }
            if ($ready) { $selected = $results[-1]; break }
          }
          $results | ConvertTo-Json -Depth 8 | Set-Content /tmp/source-results.json -Encoding UTF8
          Get-Content /tmp/source-results.json
          if ($null -eq $selected) {
            throw 'No verified Heartopia weather UI candidate was found; fail closed.'
          }
          Write-Host ('SELECTED=' + ($selected | ConvertTo-Json -Compress -Depth 8))
