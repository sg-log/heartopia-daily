name: Weather authoritative UI fix v4

on:
  push:
    branches:
      - fix/weather-authoritative-ui-gate-20260917
    paths:
      - '.github/workflows/weather-authoritative-ui-fix-v4.yml'
      - 'tools/weather-verified-panel-crop.mjs'
      - 'tools/apply-weather-artifact-crop-fix.py'

permissions:
  contents: write

jobs:
  verify-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/weather-authoritative-ui-gate-20260917
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Prepare scheduled discovery schema compatibility
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/weather-scheduled-run.yml')
          s = p.read_text(encoding='utf-8')
          old = "if (!result || result.schemaVersion !== 1 || result.responseType !== 'weather-public-discovery' || !Array.isArray(result.candidates)) {"
          new = "if (!result || ![1,3].includes(result.schemaVersion) || result.responseType !== 'weather-public-discovery' || !Array.isArray(result.candidates)) {"
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          elif new not in s:
              raise SystemExit('scheduled discovery schema gate anchor not found')

      - name: Apply strict verified-crop artifact binding compatibility
        run: python tools/apply-weather-artifact-crop-fix.py

      - name: Run focused fail-closed regression tests
        run: node --test tools/test-weather-unified-review.mjs tools/test-weather-x-embed-evidence.mjs

      - name: Capture known real weather post
        shell: bash
        run: |
          rm -rf /tmp/weather-v4 /tmp/weather-v4-result
          mkdir -p /tmp/weather-v4 /tmp/weather-v4-result
          node tools/weather-x-embed-evidence.mjs \
            --url https://x.com/i/status/2100325752185159960 \
            --output-dir /tmp/weather-v4
          pwsh -NoProfile -File tools/weather-cloud-discovery.ps1 \
            -CapturePath /tmp/weather-v4/capture.json \
            -OutputPath /tmp/weather-v4/discovery-candidate.json \
            -DiscoverySource fixture-verification \
            -SearchQuery 'known real 2026-09-17 weather fixture'

      - name: Run unified strict review
        shell: bash
        run: |
          node tools/weather-unified-review.mjs \
            --mode inspect \
            --capture-dir /tmp/weather-v4 \
            --target-date 2026-09-17 \
            --output /tmp/weather-v4-review.json
          cat /tmp/weather-v4-review.json

      - name: Assert exact verified panel and capture metadata
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const r=JSON.parse(fs.readFileSync('/tmp/weather-v4-review.json','utf8'));
          const capture=JSON.parse(fs.readFileSync('/tmp/weather-v4/capture.json','utf8'));
          const expectedDaily=['雨','晴','晴','晴','晴'];
          const expectedWeekly=['晴','晴','虹','晴','晴'];
          const daily=r.interpretation?.slots?.map(s=>s.weather?.[0]);
          const weekly=r.interpretation?.weeklyDays?.map(d=>d.weather?.[0]);
          if(!r.ready) throw new Error('Unified verified-panel review is not ready');
          if(r.selectedImage?.file!=='verified-weather-panel.jpg') throw new Error(`Unexpected evidence ${r.selectedImage?.file}`);
          if(r.pendingEvidenceFile!=='verified-weather-panel.jpg') throw new Error(`Unexpected pending evidence ${r.pendingEvidenceFile}`);
          if(r.diagnostics?.mode!=='verified-game-ui-crop') throw new Error(`Unexpected review mode ${r.diagnostics?.mode}`);
          const observed=Number(r.diagnostics?.inferred?.observed||0);
          if(observed<2) throw new Error(`Strict time-label gate failed: observed=${observed}`);
          if(r.interpretation?.startSlot!=='00') throw new Error(`Expected start 00, got ${r.interpretation?.startSlot}`);
          if(JSON.stringify(daily)!==JSON.stringify(expectedDaily)) throw new Error(`Daily mismatch ${JSON.stringify(daily)}`);
          if(JSON.stringify(weekly)!==JSON.stringify(expectedWeekly)) throw new Error(`Weekly mismatch ${JSON.stringify(weekly)}`);
          const bytes=fs.readFileSync('/tmp/weather-v4/verified-weather-panel.jpg');
          const sha=crypto.createHash('sha256').update(bytes).digest('hex');
          if(sha!==r.selectedImage?.captureSha256) throw new Error(`Crop SHA mismatch ${sha}`);
          const matches=(capture.rawMedia||[]).filter(m=>m.file==='verified-weather-panel.jpg'&&m.sha256===sha&&m.sourceScope==='verified-game-ui-crop');
          if(matches.length!==1) throw new Error(`capture.json verified crop metadata count=${matches.length}`);
          if(capture.evidence?.sha256===sha) throw new Error('Original embed evidence was replaced instead of preserved');
          console.log(JSON.stringify({selected:r.selectedImage.file,sha,observed,start:r.interpretation.startSlot,daily,weekly,crop:r.diagnostics?.crop}));
          NODE

      - name: Upload immutable fixture artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: weather-v4-fixture-${{ github.run_id }}
          path: /tmp/weather-v4
          if-no-files-found: error
          retention-days: 1

      - name: Bind unified review to artifact
        id: bind
        shell: pwsh
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_NAME: weather-v4-fixture-${{ github.run_id }}
        run: >-
          node tools/weather-unified-bind.mjs
          --draft "/tmp/weather-v4-review.json"
          --artifact-run-id "${{ github.run_id }}"
          --artifact-id "$env:ARTIFACT_ID"
          --artifact-name "$env:ARTIFACT_NAME"
          --output "/tmp/weather-v4-envelope.json"

      - name: Verify artifact bridge and prepare pending preview only
        id: bridge
        shell: pwsh
        env:
          REVIEW_PAYLOAD_BASE64: ${{ steps.bind.outputs.review_payload_base64 }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_NAME: weather-v4-fixture-${{ github.run_id }}
        run: |
          ./tools/weather-artifact-review-request.ps1 `
            -ReviewPayloadBase64 "$env:REVIEW_PAYLOAD_BASE64" `
            -ReviewPath "/tmp/weather-v4-artifact-review.json"
          ./tools/weather-artifact-review-bridge.ps1 `
            -ReviewPath "/tmp/weather-v4-artifact-review.json" `
            -ArtifactDirectory "/tmp/weather-v4" `
            -DownloadedArtifactId "$env:ARTIFACT_ID" `
            -DownloadedArtifactName "$env:ARTIFACT_NAME" `
            -DownloadedArtifactRunId "${{ github.run_id }}" `
            -CandidatePath "/tmp/weather-v4-result/weather-candidate.json" `
            -DryRunPath "/tmp/weather-v4-result/weather-dry-run.json" `
            -PendingPreviewPath "/tmp/weather-v4-result/pending-preview.json"
          Get-Content /tmp/weather-v4-result/pending-preview.json

      - name: Assert bridge kept the exact crop and source URL
        shell: bash
        env:
          BRIDGE_READY: ${{ steps.bridge.outputs.ready }}
          PENDING_PREPARED: ${{ steps.bridge.outputs.pending_prepared }}
          CAPTURE_SHA256: ${{ steps.bridge.outputs.capture_sha256 }}
          EVIDENCE_PATH: ${{ steps.bridge.outputs.evidence_path }}
          REVIEW_SCOPE: ${{ steps.bridge.outputs.review_scope }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const r=JSON.parse(fs.readFileSync('/tmp/weather-v4-review.json','utf8'));
          const candidate=fs.readFileSync('/tmp/weather-v4-result/weather-candidate.json','utf8');
          const preview=fs.readFileSync('/tmp/weather-v4-result/pending-preview.json','utf8');
          if(process.env.BRIDGE_READY!=='true') throw new Error(`Bridge not ready: ${process.env.BRIDGE_READY}`);
          if(process.env.PENDING_PREPARED!=='true') throw new Error(`Pending preview not prepared: ${process.env.PENDING_PREPARED}`);
          if(process.env.CAPTURE_SHA256!==r.selectedImage.captureSha256) throw new Error('Bridge SHA differs from reviewed crop');
          if(path.basename(process.env.EVIDENCE_PATH||'')!=='verified-weather-panel.jpg') throw new Error(`Bridge evidence path ${process.env.EVIDENCE_PATH}`);
          if(process.env.REVIEW_SCOPE!=='artifact-captured-visual') throw new Error(`Verified crop must remain captured visual evidence: ${process.env.REVIEW_SCOPE}`);
          if(!candidate.includes('https://x.com/i/status/2100325752185159960')) throw new Error('Candidate lost original source URL');
          if(!preview.includes(r.selectedImage.captureSha256)) throw new Error('Pending preview lost crop SHA');
          console.log(JSON.stringify({bridgeReady:true,pendingPrepared:true,evidence:path.basename(process.env.EVIDENCE_PATH),sha:process.env.CAPTURE_SHA256,reviewScope:process.env.REVIEW_SCOPE}));
          NODE

      - name: Commit tested production compatibility
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/weather-scheduled-run.yml \
            tools/weather-artifact-review-request.ps1 \
            tools/weather-artifact-review-bridge.ps1
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Production compatibility already committed.'
          else
            git commit -m 'Bind verified weather crop through artifact review'
            git push origin HEAD:fix/weather-authoritative-ui-gate-20260917
          fi
