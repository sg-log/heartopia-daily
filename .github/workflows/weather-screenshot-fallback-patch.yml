name: Export weather screenshot fallback patch

on:
  push:
    branches: [feature/weather-multi-source-discovery]

permissions:
  contents: read

jobs:
  patch:
    if: ${{ github.event.head_commit.message == 'Export rendered screenshot fallback patch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/weather-multi-source-discovery
      - name: Apply exact patch
        run: python3 tools/apply-weather-screenshot-fallback.py
      - name: Validate patched diff
        run: |
          git diff --check
          git diff --stat
      - name: Export patched files
        uses: actions/upload-artifact@v4
        with:
          name: weather-screenshot-fallback-patched
          path: |
            tools/weather-x-embed-evidence.mjs
            tools/weather-artifact-review-request.ps1
            tools/weather-artifact-review-bridge.ps1
            .github/workflows/weather-cloud-x-embed-evidence.yml
            .github/workflows/weather-issue-automation.yml
          if-no-files-found: error
          retention-days: 1
