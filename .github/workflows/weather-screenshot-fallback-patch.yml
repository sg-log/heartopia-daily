name: Weather screenshot fallback branch test

on:
  push:
    branches: [feature/weather-multi-source-discovery]

permissions:
  contents: read

jobs:
  test:
    if: ${{ github.event.head_commit.message == 'Test rendered screenshot fallback' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/weather-multi-source-discovery
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Unit tests
        shell: pwsh
        run: |
          npm run test:weather-cloud-x-embed
          ./tools/test-weather-artifact-review.ps1
          node --test tools/test-weather-public-discovery.mjs
      - name: Capture real 2026-09-15 post with fallback
        run: >-
          node tools/weather-x-embed-evidence.mjs
          --url https://x.com/i/status/2099613608590381418
          --output-dir "$RUNNER_TEMP/evidence"
      - name: Build discovery record
        shell: pwsh
        run: >-
          ./tools/weather-cloud-discovery.ps1
          -CapturePath "$env:RUNNER_TEMP/evidence/capture.json"
          -OutputPath "$env:RUNNER_TEMP/evidence/discovery-candidate.json"
          -DiscoverySource "branch-live-fallback-test"
          -SearchQuery "2026-09-15 live candidate"
      - name: Verify screenshot fallback and candidate bridge
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP/evidence"
          $capture = Get-Content -LiteralPath "$root/capture.json" -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($capture.status -cne 'captured') { throw 'Fallback capture did not complete.' }
          if (@($capture.rawMedia).Count -ne 0) { throw 'Expected this regression post to use screenshot fallback.' }
          if ([string]$capture.evidence.file -cne 'evidence.jpg' -or [string]$capture.evidence.kind -cne 'embed-screenshot') { throw 'Expected embed screenshot evidence.' }
          $evidencePath = "$root/evidence.jpg"
          if (-not [IO.File]::Exists($evidencePath)) { throw 'Fallback evidence.jpg is missing.' }
          $sha = (Get-FileHash -LiteralPath $evidencePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -cne [string]$capture.evidence.sha256) { throw 'Fallback evidence SHA mismatch.' }

          $review = [ordered]@{
            schemaVersion = 4
            artifact = [ordered]@{ runId='34999999999'; id='10999999999'; name='weather-screenshot-fallback-test' }
            reviewedImages = @([ordered]@{ file='evidence.jpg'; mimeType='image/jpeg'; captureSha256=$sha })
            pendingEvidenceFile = 'evidence.jpg'
            interpretation = [ordered]@{
              ready=$true; observedDate='2026-09-15'; startSlot='06'; confidence='high'
              summary='2026-09-15の公開X埋め込み画面に表示された天気画像を確認。5枠すべて晴れ。'
              unresolved=@()
              slots=@(
                [ordered]@{slot='slot0';visible=$true;weather=@('晴');confidence='high';description='06 太陽アイコン'},
                [ordered]@{slot='slot1';visible=$true;weather=@('晴');confidence='high';description='12 太陽アイコン'},
                [ordered]@{slot='slot2';visible=$true;weather=@('晴');confidence='high';description='18 月アイコン'},
                [ordered]@{slot='slot3';visible=$true;weather=@('晴');confidence='high';description='00 月アイコン'},
                [ordered]@{slot='slot4';visible=$true;weather=@('晴');confidence='high';description='翌06 太陽アイコン'}
              )
            }
          }
          $reviewJson = $review | ConvertTo-Json -Depth 30 -Compress
          $reviewB64 = [Convert]::ToBase64String([Text.UTF8Encoding]::new($false).GetBytes($reviewJson))
          $reviewPath = "$env:RUNNER_TEMP/review.json"
          ./tools/weather-artifact-review-request.ps1 -ReviewPayloadBase64 $reviewB64 -ReviewPath $reviewPath | Out-Null
          ./tools/weather-artifact-review-bridge.ps1 `
            -ReviewPath $reviewPath -ArtifactDirectory $root `
            -DownloadedArtifactId '10999999999' -DownloadedArtifactName 'weather-screenshot-fallback-test' -DownloadedArtifactRunId '34999999999' `
            -CandidatePath "$env:RUNNER_TEMP/candidate.json" -DryRunPath "$env:RUNNER_TEMP/dry-run.json" -PendingPreviewPath "$env:RUNNER_TEMP/pending-preview.json" | Out-Null
          $preview = Get-Content -LiteralPath "$env:RUNNER_TEMP/pending-preview.json" -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($preview.status -cne 'preview' -or $preview.sent -ne $false) { throw 'Screenshot fallback did not produce a safe pending preview.' }
          if ([string]$preview.payload.evidenceImages[0].kind -cne 'screenshot') { throw 'Pending preview did not preserve screenshot evidence kind.' }
          Write-Host "PASS: live 2026-09-15 screenshot fallback -> verified candidate -> pending preview"
