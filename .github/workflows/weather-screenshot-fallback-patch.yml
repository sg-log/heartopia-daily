name: Apply weather screenshot fallback patch

on:
  push:
    branches: [feature/weather-multi-source-discovery]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message == 'Prepare rendered screenshot fallback patch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/weather-multi-source-discovery
      - name: Apply exact patch
        run: python3 tools/apply-weather-screenshot-fallback.py
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/weather-x-embed-evidence.mjs \
                  tools/weather-artifact-review-request.ps1 \
                  tools/weather-artifact-review-bridge.ps1 \
                  .github/workflows/weather-cloud-x-embed-evidence.yml \
                  .github/workflows/weather-issue-automation.yml
          git diff --cached --check
          git commit -m "Support rendered X screenshot evidence fallback"
          git push origin HEAD:feature/weather-multi-source-discovery
