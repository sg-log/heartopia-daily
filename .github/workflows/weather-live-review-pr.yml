name: Weather live review PR

on:
  pull_request:
    paths:
      - '.github/workflows/weather-live-review-pr.yml'
      - '.github/workflows/weather-scheduled-run.yml'
      - 'tools/weather-public-discovery.mjs'
      - 'tools/test-weather-public-discovery.mjs'
      - 'tools/weather-x-embed-evidence.mjs'
      - 'tools/weather-cloud-url-evidence.mjs'
      - 'tools/weather-deterministic-review.mjs'
      - 'tools/weather-unified-review.mjs'
      - 'tools/test-weather-unified-review.mjs'
      - 'assets/weather-templates/**'

permissions:
  contents: read

jobs:
  live-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate unified review helpers
        run: node --test tools/test-weather-unified-review.mjs
      - name: Discover ranked candidates for 2026-09-16
        env:
          RESULT_PATH: ${{ runner.temp }}/weather-public-discovery.json
        run: node tools/weather-public-discovery.mjs --target-date 2026-09-16 --out "$RESULT_PATH"
      - name: Capture and inspect ranked public candidates
        shell: pwsh
        env:
          RESULT_PATH: ${{ runner.temp }}/weather-public-discovery.json
          SELECTED_DIR: ${{ runner.temp }}/weather-live-selected
        run: |
          $ErrorActionPreference = 'Continue'
          $result = Get-Content -LiteralPath $env:RESULT_PATH -Raw -Encoding UTF8 | ConvertFrom-Json
          $candidates = @($result.candidates | Select-Object -First 16)
          Write-Host ("Ranked public candidate count: " + $candidates.Count)
          if ($candidates.Count -eq 0) { throw 'No relevant public candidates discovered.' }
          $selected = $null
          for ($i = 0; $i -lt $candidates.Count; $i++) {
            $candidate = $candidates[$i]
            Write-Host ("Candidate #" + $i + " type=" + [string]$candidate.sourceType + " provider=" + [string]$candidate.discoverySource + " " + [string]$candidate.sourceUrl + " score=" + [string]$candidate.relevanceScore + " dateMatched=" + [string]$candidate.dateMatched)
            $dir = Join-Path $env:RUNNER_TEMP ("weather-live-candidate-" + $i)
            if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            if ([string]$candidate.sourceType -eq 'x') {
              & node tools/weather-x-embed-evidence.mjs --url ([string]$candidate.sourceUrl) --output-dir $dir
            } elseif ([string]$candidate.sourceType -eq 'web') {
              & node tools/weather-cloud-url-evidence.mjs --url ([string]$candidate.sourceUrl) --output-dir $dir
            } else {
              Write-Host 'Unsupported candidate type.'
              continue
            }
            if ($LASTEXITCODE -ne 0) {
              Write-Host 'Capture failed.'
              continue
            }
            $review = Join-Path $dir 'review.json'
            & node tools/weather-unified-review.mjs --mode inspect --capture-dir $dir --target-date 2026-09-16 --output $review
            if (Test-Path $review) {
              $reviewObject = Get-Content -LiteralPath $review -Raw -Encoding UTF8 | ConvertFrom-Json
              Write-Host ("Review ready=" + [string]$reviewObject.ready + " weeklyCount=" + [string]@($reviewObject.interpretation.weeklyDays).Count)
              Write-Host ("Review diagnostics=" + ($reviewObject.diagnostics | ConvertTo-Json -Depth 9 -Compress))
            }
            if ($LASTEXITCODE -eq 0) {
              if (Test-Path $env:SELECTED_DIR) { Remove-Item -Recurse -Force $env:SELECTED_DIR }
              Copy-Item -Recurse -LiteralPath $dir -Destination $env:SELECTED_DIR
              $selected = $candidate
              break
            }
          }
          if ($null -eq $selected) { throw 'No ranked public candidate produced complete daily and weekly weather.' }
          Write-Host ("Selected source: " + [string]$selected.sourceUrl)
      - name: Upload live diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: weather-live-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/weather-public-discovery.json
            ${{ runner.temp }}/weather-live-candidate-*
            ${{ runner.temp }}/weather-live-selected
          if-no-files-found: warn
          retention-days: 2
