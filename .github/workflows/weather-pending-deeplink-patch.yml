name: Weather pending deep-link patch

on:
  push:
    branches: [feature/weather-pending-deeplink]
    paths:
      - .github/workflows/weather-pending-deeplink-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/weather-pending-deeplink
      - name: Patch pending deep-link behavior
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_css = '.pendingWeatherCard{border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0}\n'
          new_css = old_css + '.pendingWeatherCard.pendingWeatherTarget{outline:3px solid rgba(124,145,137,.38);outline-offset:3px;background:#f7fbf8;box-shadow:0 0 0 7px rgba(124,145,137,.08)}\n'
          assert old_css in s
          s = s.replace(old_css, new_css, 1)

          old_card = '  return `<article class="pendingWeatherCard"><strong>${esc(reportDate)} ／ ${esc(startSlot)}時開始</strong>'
          new_card = '  return `<article class="pendingWeatherCard" id="pending-weather-${esc(r.id)}" data-pending-weather-id="${esc(r.id)}"><strong>${esc(reportDate)} ／ ${esc(startSlot)}時開始</strong>'
          assert old_card in s
          s = s.replace(old_card, new_card, 1)

          marker = 'async function fetchPendingWeatherReports(){\n'
          helper = '''function pendingWeatherDeepLinkId(){
            const value = new URLSearchParams(window.location.search).get("pending") || "";
            return /^[A-Za-z0-9-]{1,100}$/.test(value) ? value : "";
          }
          function focusPendingWeatherDeepLink(){
            const id = pendingWeatherDeepLinkId();
            const card = id ? document.getElementById(`pending-weather-${id}`) : null;
            const target = card || (window.location.hash === "#pendingWeatherReports" ? E.pendingWeatherReports : null);
            if(!target) return;
            requestAnimationFrame(() => {
              target.scrollIntoView({behavior:"smooth", block:card ? "center" : "start"});
              if(card){
                card.classList.add("pendingWeatherTarget");
                window.setTimeout(() => card.classList.remove("pendingWeatherTarget"), 5000);
              }
            });
          }

          '''
          assert marker in s
          s = s.replace(marker, helper + marker, 1)

          old_render = '    E.pendingWeatherReports.innerHTML = reports.map(pendingWeatherCard).join("");\n    observePendingEvidence();\n    return reports;'
          new_render = '    E.pendingWeatherReports.innerHTML = reports.map(pendingWeatherCard).join("");\n    observePendingEvidence();\n    focusPendingWeatherDeepLink();\n    return reports;'
          assert old_render in s
          s = s.replace(old_render, new_render, 1)

          old_unlock = '    fetchGiftCodes(true);\n    fetchAccessStats();\n'
          new_unlock = '    fetchGiftCodes(true);\n    fetchAccessStats();\n    if(pendingWeatherDeepLinkId() || window.location.hash === "#pendingWeatherReports"){\n      setAdminSubtab("daily");\n      fetchPendingWeatherReports();\n    }\n'
          assert old_unlock in s
          s = s.replace(old_unlock, new_unlock, 1)

          p.write_text(s, encoding='utf-8')
      - name: Verify patch
        shell: bash
        run: |
          grep -F 'pendingWeatherTarget' index.html
          grep -F 'pendingWeatherDeepLinkId' index.html
          grep -F 'focusPendingWeatherDeepLink' index.html
          grep -F 'data-pending-weather-id' index.html
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add pending weather admin deep link'
          git push origin HEAD:feature/weather-pending-deeplink
