name: Weather discovery branch test

on:
  push:
    branches: [feature/weather-multi-source-discovery]

permissions:
  contents: read

jobs:
  test_discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test tools/test-weather-public-discovery.mjs
      - name: Live multi-source discovery for 2026-09-15
        run: node tools/weather-public-discovery.mjs --target-date 2026-09-15 --out "$RUNNER_TEMP/discovery.json"
      - name: Print result
        run: cat "$RUNNER_TEMP/discovery.json"
