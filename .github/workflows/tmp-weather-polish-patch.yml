name: Temporary weather polish patch

on:
  push:
    branches:
      - fix/weather-review-ux-meteor

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/weather-review-ux-meteor
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply one-shot patch
        run: node tools/tmp-weather-polish-patch.mjs
      - name: Commit patched files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Fix weather review UX and meteor detection"
          git push origin HEAD:fix/weather-review-ux-meteor
