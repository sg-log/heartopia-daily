name: Weather scheduler CI

on:
  pull_request:
    paths:
      - '.github/workflows/weather-scheduled-run.yml'
      - '.github/workflows/weather-scheduler-ci.yml'
      - 'tools/test-weather-scheduler-policy.mjs'
      - 'tools/README-weather-scheduler.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scheduler policy
        run: node --test tools/test-weather-scheduler-policy.mjs
