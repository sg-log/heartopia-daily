name: Weather scheduler CI

on:
  pull_request:
    paths:
      - '.github/workflows/weather-scheduled-run.yml'
      - '.github/workflows/weather-scheduler-ci.yml'
      - 'tools/test-weather-scheduler-policy.mjs'
      - 'tools/test-weather-admin-trigger.mjs'
      - 'tools/weather-public-discovery.mjs'
      - 'tools/test-weather-public-discovery.mjs'
      - 'tools/weather-deterministic-review.mjs'
      - 'tools/test-weather-deterministic-review.mjs'
      - 'tools/weather-unified-review.mjs'
      - 'tools/test-weather-unified-review.mjs'
      - 'tools/weather-evidence-recovery.mjs'
      - 'tools/test-weather-evidence-recovery.mjs'
      - 'tools/weather-weekly-screenshot-review.mjs'
      - 'tools/weather-cloud-submit-unified.ps1'
      - 'tools/weather-cloud-url-evidence.mjs'
      - 'tools/README-weather-admin-trigger.md'
      - 'tools/README-weather-scheduler.md'
      - 'tools/weather-cloud-submit.ps1'
      - 'tools/test-weather-cloud-submit.ps1'
      - 'tools/weather-weekly-submit.mjs'
      - 'tools/test-weather-weekly.mjs'
      - 'index.html'
      - 'apps-script/weather-api.gs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate scheduler policy
        run: node --test tools/test-weather-scheduler-policy.mjs
      - name: Validate public weather discovery helpers
        run: node --test tools/test-weather-public-discovery.mjs
      - name: Validate deterministic image review helpers
        run: node --test tools/test-weather-deterministic-review.mjs
      - name: Validate image-first evidence recovery helpers
        run: node --test tools/test-weather-evidence-recovery.mjs
      - name: Validate unified daily and weekly review helpers
        run: node --test tools/test-weather-unified-review.mjs
      - name: Parse unified PowerShell submitter
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path './tools/weather-cloud-submit-unified.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: Validate admin manual trigger contract
        run: node --test tools/test-weather-admin-trigger.mjs
      - name: Validate daily content dedupe
        shell: pwsh
        run: ./tools/test-weather-cloud-submit.ps1
      - name: Validate weekly content dedupe
        run: node --test tools/test-weather-weekly.mjs
