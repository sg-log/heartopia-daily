name: Weather scheduler CI

on:
  pull_request:
    paths:
      - '.github/workflows/weather-scheduled-run.yml'
      - '.github/workflows/weather-scheduler-ci.yml'
      - 'tools/test-weather-scheduler-policy.mjs'
      - 'tools/test-weather-admin-trigger.mjs'
      - 'tools/apply-weather-admin-trigger-patch.mjs'
      - 'tools/README-weather-scheduler.md'
      - 'tools/weather-cloud-submit.ps1'
      - 'tools/test-weather-cloud-submit.ps1'
      - 'tools/weather-weekly-submit.mjs'
      - 'tools/test-weather-weekly.mjs'
      - 'index.html'
      - 'apps-script/weather-api.gs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply admin trigger patch when needed
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          if grep -q 'id="runWeatherAutomationBtn"' index.html; then
            echo 'Admin trigger patch already applied.'
          else
            node tools/apply-weather-admin-trigger-patch.mjs || echo 'Patch helper reached the already-prepared CI file; validating generated files next.'
            node --test tools/test-weather-admin-trigger.mjs
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html apps-script/weather-api.gs .github/workflows/weather-scheduled-run.yml
            git diff --cached --check
            git commit -m "Add admin weather automation trigger"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate scheduler policy
        run: node --test tools/test-weather-scheduler-policy.mjs
      - name: Validate admin manual trigger contract
        run: node --test tools/test-weather-admin-trigger.mjs
      - name: Validate daily content dedupe
        shell: pwsh
        run: ./tools/test-weather-cloud-submit.ps1
      - name: Validate weekly content dedupe
        run: node --test tools/test-weather-weekly.mjs
