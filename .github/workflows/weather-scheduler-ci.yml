name: Weather scheduler CI

on:
  pull_request:
    paths:
      - '.github/workflows/weather-scheduled-run.yml'
      - '.github/workflows/weather-discord-notify.yml'
      - 'tools/README-weather-scheduler.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scheduler contract
        shell: pwsh
        run: |
          $workflow = Get-Content -LiteralPath '.github/workflows/weather-scheduled-run.yml' -Raw -Encoding UTF8
          $required = @(
            "cron: '0 22 * * *'",
            "cron: '10 22 * * *'",
            "cron: '0 10 * * *'",
            "cron: '10 10 * * *'",
            'workflow_dispatch:',
            'heartopia-weather-scheduled-success:',
            'heartopia-weather-discovery-fingerprint:'
          )
          foreach ($needle in $required) {
            if (-not $workflow.Contains($needle)) { throw "Missing scheduler contract: $needle" }
          }
