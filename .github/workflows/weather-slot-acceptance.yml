name: Weather slot acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/weather-slot-acceptance.yml'

permissions:
  contents: read
  actions: write

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify slot-aware discovery helpers
        run: |
          node --input-type=module - <<'NODE'
          import { buildQueries, candidateRelevance } from './tools/weather-public-discovery.mjs';
          const q = buildQueries('2026-09-18','morning');
          if (!q.some(x => x.includes('06:00'))) throw new Error('morning query lacks 06:00');
          const r = candidateRelevance('ハートピア お天気予報 9月18日 06:00～ 晴れ','2026-09-18','morning');
          if (!r.relevant || !r.dateMatched || !r.startSlotMatched) throw new Error('morning relevance mismatch');
          const stale = candidateRelevance('ハートピア お天気予報 9月18日 00:00～ 晴れ','2026-09-18','morning');
          if (stale.startSlotMatched) throw new Error('stale 00 start matched morning');
          console.log({queries:q, current:r, stale});
          NODE
      - run: npx playwright install --with-deps chromium
      - name: Verify real 06-start daily-only post
        shell: pwsh
        env:
          SOURCE_URL: https://x.com/i/status/2100739618446684218
          CAPTURE_DIR: ${{ runner.temp }}/daily-only-acceptance
          REVIEW_PATH: ${{ runner.temp }}/daily-only-review.json
        run: |
          New-Item -ItemType Directory -Path $env:CAPTURE_DIR -Force | Out-Null
          node tools/weather-x-embed-evidence.mjs --url "$env:SOURCE_URL" --output-dir "$env:CAPTURE_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'capture failed' }
          node tools/weather-direct-daily-panel-review.mjs --capture-dir "$env:CAPTURE_DIR" --target-date "2026-09-18" --output "$env:REVIEW_PATH"
          if ($LASTEXITCODE -ne 0) { throw 'daily-only review failed' }
          $r = Get-Content -LiteralPath $env:REVIEW_PATH -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($r.ready -ne $true -or [string]$r.interpretation.startSlot -cne '06') { throw 'daily-only acceptance mismatch' }
