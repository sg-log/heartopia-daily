name: Weather candidate diagnostic

on:
  push:
    paths:
      - '.github/workflows/weather-candidate-diagnostic.yml'
      - 'tools/weather-unified-review.mjs'
      - 'tools/weather-weekly-screenshot-review.mjs'
      - 'tools/test-weather-unified-review.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Unit regression
        run: node --test tools/test-weather-unified-review.mjs tools/test-weather-deterministic-review.mjs
      - name: Capture candidate
        run: node tools/weather-x-embed-evidence.mjs --url 'https://x.com/i/status/2100330655741845809' --output-dir "$RUNNER_TEMP/capture"
      - name: Run unified review and print diagnostics
        id: review
        shell: bash
        run: |
          set +e
          node tools/weather-unified-review.mjs --mode inspect --capture-dir "$RUNNER_TEMP/capture" --target-date '2026-09-17' --output "$RUNNER_TEMP/review.json"
          rc=$?
          echo "review_exit=$rc"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo '--- files ---'
          find "$RUNNER_TEMP/capture" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          echo '--- post content ---'
          cat "$RUNNER_TEMP/capture/post-content.txt" || true
          echo '--- review ---'
          cat "$RUNNER_TEMP/review.json" || true
          exit 0
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weather-candidate-diagnostic-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/capture
            ${{ runner.temp }}/review.json
          retention-days: 2
      - name: Require reviewer success
        if: ${{ steps.review.outputs.rc != '0' }}
        run: exit 2
