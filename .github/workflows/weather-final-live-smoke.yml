name: Weather final live smoke

on:
  push:
    paths:
      - '.github/workflows/weather-final-live-smoke.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production weather workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'weather-scheduled-run.yml',
              ref: 'main',
              inputs: {
                slot: 'morning',
                target_date: '2026-09-17',
                trigger_origin: 'manual',
                attempt_kind: 'manual'
              }
            })
            core.notice('Dispatched production weather workflow for 2026-09-17 morning.')
