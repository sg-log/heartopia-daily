name: Gift code parser CI

on:
  pull_request:
    paths:
      - "apps-script/gift-code-*.gs"
      - "tools/test-gift-discord-parser.mjs"
      - "tools/test-gift-discord-storage.mjs"
      - "tools/test-gift-discord-poll.mjs"
      - "tools/gift-discord-poll.mjs"
      - "tools/probe-heartopia-x.mjs"
      - ".github/workflows/gift-code-discord-poll.yml"
      - "package.json"
      - "README-gift-code-automation.md"
      - ".github/workflows/gift-code-parser-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm run test:gift-discord
      - name: Probe public Heartopia X endpoints
        run: node tools/probe-heartopia-x.mjs
