name: Gift code parser CI

on:
  pull_request:
    paths:
      - "apps-script/gift-*.gs"
      - "apps-script/weather-api.gs"
      - "tools/test-gift-discord-parser.mjs"
      - "tools/test-gift-discord-storage.mjs"
      - "tools/test-gift-discord-poll.mjs"
      - "tools/gift-discord-poll.mjs"
      - "tools/gift-x-backup.mjs"
      - "tools/test-gift-x-backup.mjs"
      - "tools/test-gift-claim-backup.mjs"
      - "tools/gift-code-chat-bridge.mjs"
      - "tools/test-gift-code-chat-bridge.mjs"
      - "actual-post-fixtures.json"
      - ".github/workflows/gift-code-chat-bridge.yml"
      - "index.html"
      - ".clasp.json"
      - ".claspignore"
      - ".github/workflows/gift-code-discord-poll.yml"
      - "package.json"
      - "package-lock.json"
      - "README-gift-code-automation.md"
      - ".github/workflows/gift-code-parser-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:gift-discord
