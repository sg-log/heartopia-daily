name: Gift public-source read diagnostic
on:
  push:
    branches: [diagnostics/gift-public-read-20261101]
    paths: [".github/workflows/gift-public-read-diagnostic.yml"]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Discover and parse public official gifts without writes
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import vm from 'node:vm';
          import {discoverOfficialXGiftPosts} from './tools/gift-x-backup.mjs';
          const reads=[];
          const allowed=new Set(['x.com','syndication.twitter.com','publish.twitter.com','www.bing.com','search.yahoo.co.jp']);
          const readOnly=async(url,options={})=>{
            if((options.method||'GET')!=='GET'||!allowed.has(new URL(url).hostname))throw Error('Read-only diagnostic denied request');
            reads.push(String(url));return fetch(url,options);
          };
          const discovery=await discoverOfficialXGiftPosts({fetchImpl:readOnly});
          const context=vm.createContext({DISCORD_GIFT_TIME_ZONE:'Asia/Tokyo',Utilities:{formatDate(date){return new Date(date.getTime()+9*3600000).toISOString().slice(0,16);}}});
          vm.runInContext(fs.readFileSync('./apps-script/gift-code-parser.gs','utf8'),context);
          console.log(JSON.stringify({reads:reads.length,writes:0,coverage:discovery.coverage,diagnostics:discovery.diagnostics,posts:discovery.posts.map(post=>({sourceUrl:post.sourceUrl,statusId:post.statusId,incomplete:post.incomplete,parsed:context.parseDiscordGiftAnnouncement_(post.text,{rewardNameMap:{}})}))}));
          JS
