name: Weather ops cleanup branch test

on:
  push:
    branches:
      - feature/weather-ops-cleanup

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test reopened issue routing
        shell: pwsh
        run: ./tools/test-weather-reopened-issue-request.ps1
      - name: Test existing issue validation
        shell: pwsh
        run: ./tools/test-weather-issue-request.ps1
      - name: Parse changed workflow YAML
        shell: ruby {0}
        run: |
          require 'yaml'
          %w[
            .github/workflows/weather-issue-automation.yml
            .github/workflows/weather-discovery-issue.yml
            .github/workflows/weather-discord-notify.yml
          ].each do |path|
            YAML.load_file(path, aliases: true)
            puts "OK: #{path}"
          end
