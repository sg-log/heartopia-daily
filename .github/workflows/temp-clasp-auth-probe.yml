name: Temporary clasp auth probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-clasp-auth-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check clasp auth secret presence
        shell: bash
        env:
          S1: ${{ secrets.CLASPRC_JSON }}
          S2: ${{ secrets.CLASP_CREDENTIALS }}
          S3: ${{ secrets.GOOGLE_CLASP_CREDENTIALS }}
          S4: ${{ secrets.GOOGLE_SCRIPT_CREDENTIALS }}
          S5: ${{ secrets.CLASP_TOKEN }}
        run: |
          found=0
          for name in S1 S2 S3 S4 S5; do
            if [ -n "${!name}" ]; then
              echo "$name=present"
              found=1
            else
              echo "$name=missing"
            fi
          done
          echo "any_present=$found"
