name: Weather production smoke dispatch

on:
  push:
    branches:
      - fix/weather-final-hardening-20260917
    paths:
      - '.github/workflows/weather-production-smoke-dispatch.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production weather workflow on main
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'weather-scheduled-run.yml',
              ref: 'main',
              inputs: {
                slot: 'morning',
                target_date: '2026-09-17',
                trigger_origin: 'manual',
                attempt_kind: 'manual'
              }
            })
            core.notice('Production weather workflow dispatched for 2026-09-17 morning on main.')
